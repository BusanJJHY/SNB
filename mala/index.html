<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff6e8"><title>보글보글 마라탕 가게</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff6e8;color:#443f37;font-family:system-ui,sans-serif;padding:18px 12px;min-height:100svh}main{max-width:760px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:clamp(21px,5vw,32px);margin:0;letter-spacing:-1px}header p{font-size:13px;color:#867363;margin:6px 0}.wallet{white-space:nowrap;border:2px solid #f2dba2;border-radius:18px;padding:12px;background:#fff;font-size:18px;font-weight:900}.stats{display:flex;justify-content:space-between;gap:8px;padding:12px 0;font-size:13px;font-weight:700;color:#716452}.progress{background:#eee0c9;border-radius:20px;height:8px;overflow:hidden}.progress div{height:100%;background:#e88c61;transition:width .3s}.tabs{display:flex;gap:8px;margin:14px 0}button{font:inherit;cursor:pointer;min-height:46px;border:0;border-radius:13px;padding:10px 14px;font-weight:800;touch-action:manipulation}button:focus-visible{outline:3px solid #327f78;outline-offset:3px}button:disabled{opacity:.55;cursor:default}.tabs button{flex:1;background:#ede2d0;color:#736654}.tabs button[aria-selected=true]{background:#367b73;color:white}.panel{background:#fff;border:2px solid #ead9c0;border-radius:24px;padding:18px}.order{background:#fff5df;border:1px solid #f0dcad;border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center}.customer{font-size:38px}.order h2{font-size:18px;margin:0 0 6px}.order p{margin:4px 0;font-size:14px;line-height:1.6}.chip{display:inline-block;border-radius:8px;padding:3px 6px;margin:2px;background:white;font-weight:700}.order small{color:#90764d}.cooking{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:16px;margin:14px 0}.pot{position:relative;min-height:140px;display:grid;place-items:center;background:#fff5ee;border-radius:20px}.pot svg{width:150px;height:145px}.toppings{position:absolute;top:62px;left:15px;right:15px;text-align:center;font-size:24px}.potlabel{position:absolute;bottom:10px;font-size:12px;color:#8f6f55}h3{font-size:16px;margin:8px 0}.ingredients{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ingredient{background:#f8f4e9;color:#625f47;border:2px solid #ece4cd;padding:8px 4px;min-height:78px;font-size:13px}.ingredient span{display:block;font-size:26px;margin-bottom:3px}.ingredient[aria-pressed=true]{background:#e6f4ec;border-color:#398b74;color:#276751}.ingredient[aria-pressed=true]::after{content:' ✓'}.help{font-size:12px;line-height:1.6;color:#8c7d69;margin:8px 0}.serve{width:100%;background:#e77d59;color:white;font-size:18px;min-height:54px}.feedback{line-height:1.6;font-size:14px;margin:12px 0;min-height:24px;color:#8b593f;font-weight:700}.next{width:100%;background:#367b73;color:#fff}.shopgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.shopcard{border:1px solid #e6d9c1;border-radius:18px;padding:14px;background:#fffaf0;display:flex;flex-direction:column}.shopcard h3{margin:0 0 6px}.shopcard .icon{font-size:32px}.shopcard p{font-size:12px;line-height:1.7;color:#8c7d69;flex:1;margin:6px 0 12px}.shopcard button{font-size:13px;background:#367b73;color:#fff;padding:8px}.shopcard.owned{background:#eff7ee}.shopcard.owned button{background:#d4e7d2;color:#43613e}.shopintro{font-size:13px;line-height:1.7;color:#8c7d69}.shopintro h2{color:#443f37;margin:0;font-size:21px}.receipt{padding:10px;border-radius:12px;background:#eef6eb;margin-top:8px}.footer{color:#98866e;font-size:12px;text-align:center;line-height:1.7;margin:18px 0}.footer a{color:#367b73}[hidden]{display:none!important}.steam{animation:steam 2.4s ease-in-out infinite;transform-origin:center}@keyframes steam{50%{opacity:.3;transform:translateY(-5px)}}@media(max-width:500px){body{padding:12px 8px}.panel{padding:12px}.cooking{grid-template-columns:1fr;gap:8px}.pot{min-height:132px}.pot svg{height:135px}.toppings{left:calc(50% - 58px);right:calc(50% - 58px);top:59px}.potlabel{bottom:5px}.shopcard{padding:11px}.stats{font-size:11px}.wallet{font-size:15px;padding:9px}.order{padding:10px;gap:8px}.order h2{font-size:16px}.order p{font-size:13px}}@media(prefers-reduced-motion:reduce){.steam{animation:none}.progress div{transition:none}}
</style></head><body><main>
<header><div><h1>🥘 보글보글 마라탕 가게</h1><p>작은 냄비에서 시작하는 나만의 맛집</p></div><div id="wallet" class="wallet" aria-live="polite"></div></header>
<div class="stats"><span id="rank"></span><span id="served"></span><span id="fame"></span></div><div class="progress" aria-label="다음 가게 등급까지 진행도"><div id="progress"></div></div>
<div class="tabs" role="tablist" aria-label="가게 메뉴"><button id="kitchenTab" role="tab" aria-controls="kitchen" aria-selected="true">🍲 요리하기</button><button id="shopTab" role="tab" aria-controls="shop" aria-selected="false">🌱 가게 키우기</button></div>
<section id="kitchen" class="panel" role="tabpanel" aria-labelledby="kitchenTab"><div id="order" class="order"></div><div class="cooking"><div class="pot" aria-label="내 마라탕 냄비"><svg viewBox="0 0 160 145" aria-hidden="true"><g class="steam" fill="none" stroke="#d1b6a3" stroke-width="4" stroke-linecap="round"><path d="M53 32 Q65 23 55 14 Q48 6 60 1"/><path d="M82 31 Q95 22 85 13 Q78 4 90 0"/><path d="M112 33 Q122 24 113 16"/></g><path d="M20 65 L4 65 L4 80 L22 84 M139 65 L156 65 L156 80 L138 84" fill="#657e77"/><path d="M19 61 L28 114 Q80 147 132 114 L141 61 Z" fill="#367b73"/><ellipse cx="80" cy="61" rx="61" ry="23" fill="#e6bb92" stroke="#75978b" stroke-width="5"/><ellipse cx="80" cy="62" rx="54" ry="17" fill="#db7851"/><path d="M36 96 Q46 109 60 112" fill="none" stroke="#75a397" stroke-width="5" stroke-linecap="round"/></svg><div id="toppings" class="toppings"></div></div><div><h3>주문에 있는 재료를 골라 넣어요</h3><div id="ingredients" class="ingredients"></div><p class="help">한 번 더 누르면 빼요. 시간 제한은 없어요!</p></div></div><button id="serve" class="serve">🔥 끓여서 판매하기</button><div id="feedback" class="feedback" role="status">손님이 부탁한 재료를 냄비에 담아 주세요.</div><button id="next" class="next" hidden>😊 다음 손님 받기 →</button></section>
<section id="shop" class="panel" role="tabpanel" aria-labelledby="shopTab" hidden><div class="shopintro"><h2>🌱 작은 가게를 동네 맛집으로!</h2><p>재료가 늘면 메뉴 가격도 올라가요. 좋은 육수, 광고, 좌석으로 가게를 키워 보세요.<br>업그레이드는 다음 손님 주문부터 적용돼요.</p></div><h3>🥬 더 풍성한 재료</h3><div id="ingredientShop" class="shopgrid"></div><h3>✨ 가게 업그레이드</h3><div id="upgradeShop" class="shopgrid"></div><div id="shopFeedback" class="feedback" role="status"></div></section>
<p class="footer">게임 코인으로 운영하는 가게예요. 실제 결제는 없어요.<br>가게 성장은 이 브라우저에 자동 저장돼요.<br><a href="../">점프</a> · <a href="../addition/">은별이 덧셈</a> · <a href="../rhythm/">리듬게임</a></p>
</main><script>
const $=s=>document.querySelector(s),KEY='mala-shop-v1';
const ingredients=[{id:'cabbage',name:'청경채',icon:'🥬',cost:2,price:0,need:0},{id:'noodle',name:'당면',icon:'🍜',cost:3,price:0,need:0},{id:'tofu',name:'두부',icon:'🧈',cost:2,price:0,need:0},{id:'mushroom',name:'버섯',icon:'🍄',cost:3,price:45,need:2},{id:'lotus',name:'연근',icon:'🪷',cost:4,price:75,need:4},{id:'beef',name:'소고기',icon:'🥩',cost:6,price:120,need:7},{id:'shrimp',name:'새우',icon:'🦐',cost:7,price:180,need:11},{id:'fishball',name:'어묵볼',icon:'🍡',cost:5,price:240,need:15}];
const initial=()=>({coins:40,unlocked:['cabbage','noodle','tofu'],served:0,orders:0,broth:0,seats:0,fame:0,adLeft:0,earned:0});let data=initial(),order=null,selected=[],sold=false;
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&['coins','served','earned'].every(k=>Number.isSafeInteger(s[k])&&s[k]>=0)&&['broth','seats','fame','adLeft'].every(k=>Number.isInteger(s[k])&&s[k]>=0&&s[k]<=(k==='adLeft'?5:k==='seats'?2:3))&&Array.isArray(s.unlocked)){data={...s,orders:Number.isSafeInteger(s.orders)&&s.orders>=0?s.orders:s.served,unlocked:ingredients.filter(i=>i.price===0||s.unlocked.includes(i.id)).map(i=>i.id)}}}catch{}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{}}
function item(id){return ingredients.find(i=>i.id===id)}
function rank(){const tiers=[{need:0,name:'골목 작은 가게'},{need:5,name:'동네 인기 가게'},{need:15,name:'줄 서는 맛집'},{need:30,name:'마라탕 명품 맛집'}];return tiers.filter(t=>data.served>=t.need).at(-1)}
function renderStats(){const r=rank(),next=[5,15,30].find(n=>n>data.served);$('#wallet').textContent=`🪙 ${data.coins}`;$('#rank').textContent=`🏠 ${r.name}`;$('#served').textContent=`🍲 판매 ${data.served}그릇`;$('#fame').textContent=`📣 인지도 ${data.fame}/3`;$('#progress').style.width=(next?Math.min(100,(data.served-r.need)/(next-r.need)*100):100)+'%';$('.progress').setAttribute('aria-label',next?`${next}그릇 팔면 다음 등급! 현재 ${data.served}그릇`:'최고 등급 달성!')}
function newOrder(){sold=false;selected=[];const pool=[...data.unlocked];const count=data.unlocked.length<5?2:3;const requested=[];while(requested.length<count){const index=Math.floor(Math.random()*pool.length);requested.push(pool.splice(index,1)[0])}const quantity=data.seats&&((data.orders+1)%3===0)?data.seats+1:1;const cost=requested.reduce((sum,id)=>sum+item(id).cost,0);const price=18+cost*2+(data.unlocked.length-3)*3+data.broth*6+data.fame*2+(data.adLeft>0?4:0);order={requested,quantity,cost,price,advertised:data.adLeft>0};$('#next').hidden=true;$('#feedback').textContent='손님이 부탁한 재료를 냄비에 담아 주세요.';$('#serve').disabled=false;renderOrder();renderIngredients()}
function renderOrder(){const rich=data.unlocked.length>=6,group=order.quantity>1;$('#order').innerHTML=`<div class="customer">${group?'👨‍👩‍👧':rich?'😎':'😊'}</div><div><h2>${group?'친구들과 함께 온 손님':rich?'프리미엄 마라탕 손님':'마라탕 먹으러 온 손님'}</h2><p>${order.requested.map(id=>`<span class="chip">${item(id).icon} ${item(id).name}</span>`).join('')} 넣어 주세요!</p><p><strong>${order.quantity}그릇 · 판매가 ${order.price*order.quantity}코인</strong>${order.advertised?' · 📣 광고 손님':''}</p><small>재료비 ${order.cost*order.quantity}코인 · 예상 순이익 ${(order.price-order.cost)*order.quantity}코인</small></div>`}
function renderIngredients(){$('#ingredients').innerHTML=data.unlocked.map(id=>`<button class="ingredient" data-ingredient="${id}" aria-pressed="${selected.includes(id)}" ${sold?'disabled':''}><span>${item(id).icon}</span>${item(id).name}</button>`).join('');for(const b of document.querySelectorAll('[data-ingredient]'))b.addEventListener('click',()=>toggleIngredient(b.dataset.ingredient));$('#toppings').textContent=selected.map(id=>item(id).icon).join('')}
function toggleIngredient(id){if(sold||!data.unlocked.includes(id))return;if(selected.includes(id))selected=selected.filter(i=>i!==id);else selected.push(id);renderIngredients()}
function serve(){if(sold)return;const missing=order.requested.filter(id=>!selected.includes(id)),extra=selected.filter(id=>!order.requested.includes(id));if(missing.length||extra.length){$('#feedback').textContent=missing.length?`${missing.map(id=>item(id).icon+' '+item(id).name).join(', ')}도 넣어 주세요!${extra.length?' 주문에 없는 재료는 눌러서 빼 주세요.':''}`:'주문에 없는 재료는 한 번 더 눌러서 빼 주세요. 코인은 줄지 않아요!';return}sold=true;const profit=(order.price-order.cost)*order.quantity,oldRank=rank().name;data.coins+=profit;data.earned+=profit;data.served+=order.quantity;data.orders++;if(order.advertised&&data.adLeft>0)data.adLeft--;save();renderStats();renderIngredients();renderShop();$('#serve').disabled=true;$('#feedback').innerHTML=`😋 맛있어요! ${order.quantity}그릇 판매 완료!<div class="receipt">판매 +${order.price*order.quantity} − 재료비 ${order.cost*order.quantity} = <strong>순이익 +${profit}코인</strong>${rank().name!==oldRank?'<br>🎉 '+rank().name+'로 성장했어요!':''}</div>`;$('#next').hidden=false}
function shopCard(icon,name,description,key,price,disabled,label,owned=false){return `<article class="shopcard ${owned?'owned':''}"><div class="icon">${icon}</div><h3>${name}</h3><p>${description}</p><button data-buy="${key}" ${disabled?'disabled':''}>${label||'🪙 '+price+' · 구매'}</button></article>`}
function renderShop(){$('#ingredientShop').innerHTML=ingredients.map(i=>{const owned=data.unlocked.includes(i.id),locked=data.served<i.need;return shopCard(i.icon,i.name,owned?'냄비에 넣을 수 있어요.':`메뉴 기본 가격 +3코인!<br>${i.need}그릇 판매 후 구매할 수 있어요.`,i.id,i.price,owned||locked||data.coins<i.price,owned?'✓ 사용 중':locked?`${i.need-data.served}그릇 더 팔면 열려요`:null,owned)}).join('');const brothCost=80+data.broth*80,seatsCost=110+data.seats*130,adCost=50+data.fame*50;$('#upgradeShop').innerHTML=shopCard('🍲',`육수 연구 ${data.broth}/3`,'깊고 맛있는 육수로 한 그릇 가격 +6코인!','broth',brothCost,data.broth>=3||data.coins<brothCost,data.broth>=3?'✓ 명품 육수 완성':null,data.broth>=3)+shopCard('🪑',`좌석 확장 ${data.seats}/2`,'손님을 더 모아 단체 주문을 받아요!<br>확장 후 세 번째 판매 차례마다 2~3그릇 주문.','seats',seatsCost,data.seats>=2||data.coins<seatsCost,data.seats>=2?'✓ 넓은 가게 완성':null,data.seats>=2)+shopCard('📣',`가게 광고 · 인지도 ${data.fame}/3`,'인지도 +1로 한 그릇 가격 +2코인!<br>다음 5주문은 광고 효과로 추가 +4코인.','advertise',adCost,data.fame>=3||data.coins<adCost,data.fame>=3?'✓ 동네 모두 아는 맛집':null,data.fame>=3)+`<article class="shopcard"><div class="icon">🏆</div><h3>나의 성장 기록</h3><p>판매 ${data.served}그릇<br>재료 ${data.unlocked.length}/8개<br>누적 순이익 ${data.earned}코인<br>광고 효과 ${data.adLeft}주문 남음<br>30그릇 판매하면 명품 맛집!</p></article>`;for(const b of document.querySelectorAll('[data-buy]'))b.addEventListener('click',()=>buy(b.dataset.buy))}
function buy(key){let price,name;const ingredient=item(key);if(ingredient){if(data.unlocked.includes(key)||data.served<ingredient.need)return;price=ingredient.price;name=ingredient.name}else if(key==='broth'){if(data.broth>=3)return;price=80+data.broth*80;name='육수 연구'}else if(key==='seats'){if(data.seats>=2)return;price=110+data.seats*130;name='좌석 확장'}else if(key==='advertise'){if(data.fame>=3)return;price=50+data.fame*50;name='가게 광고'}else return;if(data.coins<price){$('#shopFeedback').textContent='코인이 부족해요. 마라탕을 더 팔아 볼까요?';return}data.coins-=price;if(ingredient)data.unlocked.push(key);else if(key==='broth')data.broth++;else if(key==='seats')data.seats++;else{data.fame++;data.adLeft=5}save();renderStats();renderShop();renderIngredients();$('#shopFeedback').textContent=`🎉 ${name} 완료! 다음 손님부터 더 멋진 가게로 장사해요.`}
function tab(shop){$('#kitchen').hidden=shop;$('#shop').hidden=!shop;$('#kitchenTab').setAttribute('aria-selected',String(!shop));$('#shopTab').setAttribute('aria-selected',String(shop));if(shop)renderShop()}
$('#kitchenTab').addEventListener('click',()=>tab(false));$('#shopTab').addEventListener('click',()=>tab(true));$('#serve').addEventListener('click',serve);$('#next').addEventListener('click',()=>{if(sold)newOrder()});renderStats();renderShop();newOrder();
</script></body></html>
