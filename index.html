<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>점프! — 작은 점프게임</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f3e9;color:#253c35;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100svh;padding:24px}main{width:min(880px,100%)}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:clamp(32px,6vw,52px);margin:0;letter-spacing:-2px}header p{font-size:14px;color:#64756b}canvas{display:block;width:100%;aspect-ratio:2/1;background:#d5eee7;border-radius:20px;box-shadow:0 12px 40px #29433415;touch-action:manipulation;margin:24px 0}footer{display:flex;align-items:center;justify-content:space-between;gap:16px}button{border:0;background:#294f40;color:white;border-radius:99px;padding:14px 24px;font-size:16px;font-weight:700;cursor:pointer}button:hover{background:#3e705a}footer p{font-size:14px;color:#64756b}button:focus-visible{outline:3px solid #e8a844;outline-offset:4px}
</style>
</head>
<body><main><header><div><h1>점프!</h1><p>작은 모험, 한 번의 점프.</p></div><strong id="score" aria-live="off">점수 0 · 최고 0</strong></header><canvas id="game" width="880" height="440" aria-label="장애물을 뛰어넘는 점프게임. 스페이스바 또는 화면 터치로 시작하고 점프하세요."></canvas><footer><button id="jump">시작 / 점프 ↑</button><p>스페이스바 · ↑ · 화면 터치<br>부딪히면 다시 도전!<br><a href="racing/">레이싱게임</a> · <a href="rhythm/">리듬게임</a> · <a href="addition/">은별이 덧셈게임</a> · <a href="mala/">마라탕 가게</a> · <a href="multiply/">곱셈 정원</a> · <a href="princess/">공주 별나라</a> · <a href="music/">음악학교</a></p></footer></main>
<script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),scoreEl=document.querySelector('#score');
let best=0;try{best=Number(localStorage.getItem('jump-best'))||0}catch{}
let state='ready',player,obstacles,score,speed,timer,last=0,ground=350;
function reset(){player={x:110,y:ground-46,w:34,h:46,vy:0};obstacles=[];score=0;speed=300;timer=1.3;updateScore()}
function updateScore(){scoreEl.textContent=`점수 ${score} · 최고 ${best}`}
function action(){if(state!=='playing'){reset();state='playing';last=0}if(player.y>=ground-player.h-.5)player.vy=-650}
function draw(){ctx.clearRect(0,0,880,440);ctx.fillStyle='#d5eee7';ctx.fillRect(0,0,880,440);ctx.fillStyle='#fff9d9';ctx.beginPath();ctx.arc(740,80,33,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#eef9f5';for(const [x,y] of [[80,95],[350,55],[590,130]]){ctx.beginPath();ctx.ellipse(x,y,55,15,0,0,Math.PI*2);ctx.fill()}
ctx.fillStyle='#a6cec0';ctx.beginPath();ctx.moveTo(0,ground);ctx.quadraticCurveTo(150,180,310,ground);ctx.quadraticCurveTo(540,200,740,ground);ctx.lineTo(880,ground);ctx.fill();ctx.fillStyle='#436b52';ctx.fillRect(0,ground,880,5);ctx.fillStyle='#e3d7b3';ctx.fillRect(0,ground+5,880,90);
ctx.fillStyle='#c76e4b';for(const o of obstacles){ctx.fillRect(o.x,o.y,o.w,o.h);ctx.fillStyle='#f2b78a';ctx.fillRect(o.x+5,o.y+6,o.w-10,4);ctx.fillStyle='#c76e4b'}
ctx.fillStyle='#e95948';ctx.fillRect(player.x-3,player.y,40,10);ctx.fillStyle='#f2c296';ctx.fillRect(player.x+5,player.y+10,26,14);ctx.fillStyle='#253c35';ctx.fillRect(player.x+24,player.y+14,4,4);ctx.fillStyle='#416a9b';ctx.fillRect(player.x+4,player.y+24,27,16);ctx.fillStyle='#253c35';ctx.fillRect(player.x,player.y+40,14,6);ctx.fillRect(player.x+22,player.y+40,14,6);
if(state!=='playing'){ctx.fillStyle='#253c35';ctx.textAlign='center';ctx.font='bold 34px system-ui';ctx.fillText(state==='dead'?'앗! 다시 도전할까요?':'가볍게 뛰어볼까요?',440,190);ctx.font='18px system-ui';ctx.fillText(state==='dead'?`점수 ${score} · 터치하거나 스페이스바로 다시 시작`:'터치하거나 스페이스바를 눌러 시작',440,225)}}
function tick(time){const dt=last?Math.min((time-last)/1000,.035):0;last=time;if(state==='playing'){player.vy+=1800*dt;player.y+=player.vy*dt;if(player.y>ground-player.h){player.y=ground-player.h;player.vy=0}speed=Math.min(480,speed+3*dt);timer-=dt;if(timer<=0){const h=30+Math.random()*22;obstacles.push({x:900,y:ground-h,w:28,h,counted:false});timer=1.35+Math.random()*.7}for(const o of obstacles){o.x-=speed*dt;if(!o.counted&&o.x+o.w<player.x){o.counted=true;score++;updateScore()}if(player.x+player.w-4>o.x&&player.x+4<o.x+o.w&&player.y+player.h-2>o.y&&player.y+2<o.y+o.h){state='dead';best=Math.max(best,score);try{localStorage.setItem('jump-best',best)}catch{}updateScore();break}}obstacles=obstacles.filter(o=>o.x+o.w>0)}draw();requestAnimationFrame(tick)}
document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(!e.repeat)action()}});canvas.addEventListener('pointerdown',action);document.querySelector('#jump').addEventListener('click',action);document.addEventListener('visibilitychange',()=>{last=0});reset();requestAnimationFrame(tick);
</script></body></html>
