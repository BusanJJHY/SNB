<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff6ed"><title>딩동댕 작은 음악학교</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff6ed;color:#574866;font-family:system-ui,sans-serif;min-height:100svh;padding:16px 10px}main{max-width:650px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:8px}h1{font-size:clamp(21px,5vw,30px);margin:0}header p{font-size:12px;color:#95859c;margin:6px 0}.best{background:#fff;border:2px solid #ecd4ab;border-radius:18px;padding:10px;white-space:nowrap;font-weight:800}.stats{display:flex;justify-content:space-between;font-size:13px;margin:12px 0;color:#867294}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;padding:10px;border:1px solid #e9dceb;border-radius:16px;font-size:13px}select{font:inherit;padding:8px;border:1px solid #e2d1ec;border-radius:10px;background:#fbf4ff;color:#73558d}button{font:inherit;font-weight:800;border:0;border-radius:13px;min-height:44px;padding:9px;cursor:pointer;touch-action:manipulation}button:focus-visible,select:focus-visible{outline:3px solid #a081c1;outline-offset:2px}button:disabled{opacity:.5;cursor:default}.modes,.actions{display:flex;gap:7px;margin:10px 0}.modes button{flex:1;background:#eae1ef;color:#826b91;font-size:14px}.modes button[aria-pressed=true]{background:#8d6bac;color:#fff}.actions button{flex:1;background:#f3d6a4;color:#6d542f;font-size:13px}#start{background:#d5ecc5;color:#51724b}#stop{background:#eae1ef;color:#826b91}.lesson{background:#fff;border:2px solid #e8d9ed;border-radius:22px;padding:14px}.lesson h2{font-size:19px;margin:0 0 5px}.lesson p{font-size:12px;color:#95859c;line-height:1.5;margin:6px 0}.ribbon{display:flex;gap:6px;margin:12px 0;justify-content:center}.note{flex:1;max-width:70px;min-height:52px;background:#f1e8f8;border-radius:12px;text-align:center;padding:8px 4px;font-weight:800;font-size:19px;color:#987da8}.note.current{background:#ffdb7e;color:#765629;border:2px solid #e7b64d}.note small{display:block;font-size:10px;font-weight:500}.progress{height:7px;background:#eee3f3;border-radius:20px;overflow:hidden}.progress div{height:100%;background:#b68fd0;width:0}canvas{width:100%;height:auto;aspect-ratio:640/210;display:block;margin:10px 0;border-radius:14px;background:#f9f5fc}.piano{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}.key{position:relative;min-width:0;min-height:120px;background:linear-gradient(#fff,#f3eaf8);border:2px solid #decce9;border-bottom:6px solid #c9afd9;color:#73558d;padding:12px 4px;font-size:22px;touch-action:none;user-select:none;-webkit-user-select:none}.key small{display:block;font-size:11px;color:#9a85a6;margin-top:6px}.key.expected{border-color:#e6b244;background:#fff2bf;box-shadow:0 0 0 2px #f5cf6c}.key.active{background:#e3c7f5;border-bottom-width:2px;transform:translateY(2px)}#status{font-size:14px;font-weight:700;line-height:1.6;min-height:42px;color:#80659a;text-align:center;margin:10px 0}#result{text-align:center;font-size:13px;line-height:1.6;color:#867294}.footer{font-size:12px;text-align:center;line-height:1.7;color:#9a88a0;margin:12px 0}.footer a{color:#8d6bac}@media(max-width:500px){body{padding:10px 8px}.lesson{padding:12px}.piano{grid-template-columns:repeat(4,1fr);gap:6px}.key{min-height:76px;padding:7px 4px;font-size:22px}.key small{margin-top:2px}.modes button{font-size:12px}.toolbar{font-size:12px}.note{font-size:17px}canvas{max-height:135px}.stats{margin:8px 0}}@media(prefers-reduced-motion:reduce){.key.active{transform:none}}
</style></head><body><main>
<header><div><h1>🎹 딩동댕 작은 음악학교</h1><p>학교종이 땡땡땡 · 여러 악기로 연주해요</p></div><div id="best" class="best"></div></header><div class="stats"><span id="score">점수 0</span><span id="combo">콤보 0</span><span id="counter">0 / 24음</span></div>
<div class="toolbar"><label for="instrument">악기 고르기</label><select id="instrument"><option value="piano">🎹 피아노</option><option value="recorder">🪈 리코더</option><option value="xylophone">🌈 실로폰</option><option value="guitar">🎸 기타</option><option value="musicbox">✨ 오르골</option></select><label for="tempo">빠르기</label><select id="tempo"><option value="72">천천히</option><option value="96" selected>보통</option><option value="120">빠르게</option></select></div>
<div class="modes" aria-label="연주 방법"><button data-mode="practice" aria-pressed="true">🌷 따라 치기</button><button data-mode="rhythm" aria-pressed="false">⭐ 리듬 도전</button><button data-mode="free" aria-pressed="false">🎶 자유 연주</button></div><div class="actions"><button id="start">▶ 따라 치기 시작</button><button id="listen">🔊 노래 들어보기</button><button id="stop" disabled>■ 멈추기</button></div>
<section class="lesson"><h2>🔔 학교종이 땡땡땡</h2><p id="guide">노란 건반을 따라 눌러요. 천천히 해도 괜찮아요!</p><div class="ribbon" id="ribbon" aria-label="연주할 음 순서"></div><div class="progress" aria-label="곡 진행도"><div id="progress"></div></div><canvas id="game" width="640" height="210" aria-label="리듬 도전에서는 음표가 아래 흰 선에 닿을 때 같은 이름의 건반을 누르세요."></canvas><div id="piano" class="piano" aria-label="도레미파솔라시도 건반"></div><p id="status" role="status">악기를 고르고 시작해 볼까요? 소리를 켜 주세요!</p><div id="result" aria-live="polite"></div></section>
<p class="footer">컴퓨터: A S D F G H J K · 폰: 화면 건반<br>화면을 떠나면 연주가 멈춰요. 최고 점수는 이 브라우저에 저장돼요.<br>곡: 학교종(김메리 작곡) · 소리는 브라우저에서 직접 합성해요.<br><a href="../drums/">꼬마 드럼</a> · <a href="../rhythm/">리듬게임</a> · <a href="../princess/">공주 별나라</a> · <a href="../addition/">은별이 덧셈</a></p>
</main><script>
const $=s=>document.querySelector(s),canvas=$('#game'),g=canvas.getContext('2d');const names=['도','레','미','파','솔','라','시','높은 도'],codes=['KeyA','KeyS','KeyD','KeyF','KeyG','KeyH','KeyJ','KeyK'],midi=[60,62,64,65,67,69,71,72],colors=['#efaaaa','#efc28a','#e6d789','#b9d695','#8fd1cf','#a3bfea','#c9a7e2','#e4abd4'];
// School Bell melody, quarter-note beat lengths. No prerecorded audio.
const phrase=[[4,1],[4,1],[5,1],[5,1],[4,1],[4,1],[2,2],[4,1],[4,1],[2,1],[2,1],[1,4],[4,1],[4,1],[5,1],[5,1],[4,1],[4,1],[2,2],[4,1],[2,1],[1,1],[2,1],[0,4]];
const presets={piano:{partials:[1,2,3,4],amps:[.32,.13,.05,.025],attack:.005,decay:.9},recorder:{partials:[1,2,3],amps:[.36,.05,.015],attack:.04,decay:.65},xylophone:{partials:[1,2.76,5.4],amps:[.4,.12,.04],attack:.002,decay:.32},guitar:{partials:[1,2,3,4],amps:[.28,.12,.07,.025],attack:.004,decay:.55},musicbox:{partials:[1,2,3,4.2],amps:[.3,.14,.07,.02],attack:.003,decay:1.25}};
let audio=null,master=null,voices=new Set(),mode='practice',state='ready',chart=[],base=0,nextAudio=0,index=0,score=0,combo=0,maxCombo=0,perfect=0,good=0,miss=0,best=0,step=.625,length=20,flashes=Array(8).fill(0),pads=[],generation=0;
try{best=Number(localStorage.getItem('music-school-best'))||0}catch{}
async function unlock(){if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=.36;const compressor=audio.createDynamicsCompressor();compressor.threshold.value=-18;compressor.ratio.value=6;master.connect(compressor);compressor.connect(audio.destination)}if(audio.state!=='running')await audio.resume()}
function tone(key,at=audio.currentTime,duration=.5,kind=$('#instrument').value){const p=presets[kind],f=440*2**((midi[key]-69)/12),dur=kind==='recorder'?Math.max(.18,duration):Math.max(.2,p.decay);p.partials.forEach((partial,i)=>{const osc=audio.createOscillator(),gain=audio.createGain();osc.frequency.value=f*partial;osc.type='sine';gain.gain.setValueAtTime(.0001,at);gain.gain.linearRampToValueAtTime(p.amps[i],at+p.attack);if(kind==='recorder'){gain.gain.setValueAtTime(p.amps[i]*.8,at+dur*.72);gain.gain.exponentialRampToValueAtTime(.0001,at+dur)}else gain.gain.exponentialRampToValueAtTime(.0001,at+dur/(1+i*.25));osc.connect(gain);gain.connect(master);voices.add(osc);osc.onended=()=>{voices.delete(osc);gain.disconnect();osc.disconnect()};osc.start(at);osc.stop(at+dur+.04)})}
function silence(){if(!audio)return;for(const o of voices){try{o.stop(audio.currentTime)}catch{}}voices.clear()}
function makeChart(){step=60/Number($('#tempo').value);let beat=0;chart=phrase.map(([key,beats])=>{const n={key,beats,time:beat*step,done:false};beat+=beats;return n});length=beat*step;index=nextAudio=0}
function stats(){$('#score').textContent=`점수 ${score}`;$('#combo').textContent=`콤보 ${combo}`;$('#counter').textContent=`${state==='listen'?Math.min(index,24):chart.filter(n=>n.done).length} / 24음`;$('#best').textContent=`⭐ ${best}`}
function paint(){const upcoming=chart.slice(index,index+5);$('#ribbon').innerHTML=upcoming.length?upcoming.map((n,i)=>`<div class="note ${i===0?'current':''}">${names[n.key]}<small>${n.beats}박</small></div>`).join(''):'<div class="note">🎉<small>끝!</small></div>';for(const p of pads)p.classList.toggle('expected',state==='playing'&&mode==='practice'&&Number(p.dataset.key)===chart[index]?.key);$('#progress').style.width=(index/24*100)+'%';stats()}
function resetUi(){$('#start').disabled=false;$('#listen').disabled=false;$('#stop').disabled=true;$('#tempo').disabled=false}
function stop(message='연주를 멈췄어요. 준비되면 다시 시작해요!'){generation++;state='ready';silence();resetUi();pads.forEach(p=>p.classList.remove('expected'));$('#status').textContent=message}
function complete(){state='finished';best=Math.max(best,score);try{localStorage.setItem('music-school-best',best)}catch{}resetUi();index=24;paint();$('#status').textContent='🎉 학교종을 끝까지 연주했어요! 정말 멋져요!';$('#result').textContent=mode==='practice'?`24음 완주 · 최대 콤보 ${maxCombo}`:`PERFECT ${perfect} · GOOD ${good} · MISS ${miss} · 최대 콤보 ${maxCombo}`}
async function begin(listen=false){const run=++generation;state='starting';$('#start').disabled=$('#listen').disabled=true;try{await unlock();if(run!==generation)return;silence();makeChart();score=combo=maxCombo=perfect=good=miss=0;flashes.fill(0);$('#result').textContent='';$('#tempo').disabled=true;if(listen){state='listen';base=audio.currentTime+.25;$('#status').textContent='귀 기울여 들어 봐요. 음 이름도 따라가요!'}else if(mode==='free'){state='free';resetUi();$('#stop').disabled=false;$('#status').textContent='마음껏 연주해요! 악기도 바꿔 보세요.'}else{state='playing';base=audio.currentTime+2;$('#status').textContent=mode==='practice'?`먼저 ${names[chart[0].key]} 건반을 눌러요!`:'2초 뒤 시작! 음표가 흰 선에 닿을 때 눌러요.'}$('#stop').disabled=false;paint();if(innerHeight<760)canvas.scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'})}catch{if(run!==generation)return;stop('소리를 켜지 못했어요. 시작 버튼을 다시 눌러 주세요.')}}
async function press(key){const run=generation;try{await unlock();if(run!==generation)return;tone(key);flashes[key]=audio.currentTime+.16;if(state!=='playing')return;if(mode==='practice'){if(chart[index].key!==key){combo=0;stats();$('#status').textContent=`괜찮아요! 지금은 노란 ${names[chart[index].key]} 건반을 눌러요 🌷`;return}chart[index].done=true;score+=10;combo++;maxCombo=Math.max(maxCombo,combo);index++;if(index===24)complete();else{$('#status').textContent=`딩동댕! 다음은 ${names[chart[index].key]} 🎵`;paint()}}else{const t=audio.currentTime-base,n=chart.find(n=>!n.done&&n.key===key&&Math.abs(n.time-t)<=.2);if(!n)return;n.done=true;const exact=Math.abs(n.time-t)<=.09;if(exact)perfect++;else good++;combo++;maxCombo=Math.max(maxCombo,combo);score+=exact?30:20;$('#status').textContent=exact?'✨ PERFECT!':'🌷 GOOD!';while(index<chart.length&&chart[index].done)index++;paint()}}catch{$('#status').textContent='소리를 시작하려면 시작 버튼을 다시 눌러 주세요.'}}
function tick(){if(audio){const now=audio.currentTime,t=now-base;if(state==='listen'){while(nextAudio<chart.length&&base+chart[nextAudio].time<now+.15){const n=chart[nextAudio++];tone(n.key,Math.max(now,base+n.time),n.beats*step*.9)}index=chart.filter(n=>n.time<=t).length;const active=chart.findLast(n=>n.time<=t);if(active)flashes[active.key]=now+.04;paint();if(t>=length){state='ready';resetUi();$('#status').textContent='이제 직접 따라 쳐 볼까요?';index=0;paint()}}else if(state==='playing'&&mode==='rhythm'){for(const n of chart)if(!n.done&&t-n.time>.2){n.done=true;miss++;combo=0;$('#status').textContent='괜찮아요! 다음 음에 도전해요 🌷'}while(index<chart.length&&chart[index].done)index++;paint();if(t>=length+.3)complete()}for(const p of pads)p.classList.toggle('active',flashes[Number(p.dataset.key)]>now)}draw();requestAnimationFrame(tick)}
function draw(){g.clearRect(0,0,640,210);const target=175;for(let k=0;k<8;k++){g.fillStyle=k%2?'#f2eaf7':'#faf5fc';g.fillRect(k*80,0,80,210);g.fillStyle=colors[k];g.fillRect(k*80+5,target-4,70,8);g.fillStyle='#7c638f';g.font='13px system-ui';g.textAlign='center';g.fillText(names[k],k*80+40,201)}g.fillStyle='#fff';g.fillRect(0,target,640,2);if(state==='playing'&&mode==='rhythm'){const t=audio.currentTime-base;for(const n of chart){if(n.done)continue;const y=target-(n.time-t)/1.7*target;if(y<-20||y>210)continue;g.fillStyle=colors[n.key];g.fillRect(n.key*80+8,y-10,64,20);g.fillStyle='#55415f';g.font='bold 14px system-ui';g.fillText(names[n.key],n.key*80+40,y+5)}}else{g.textAlign='center';g.fillStyle='#9c7fb2';g.font='bold 24px system-ui';g.fillText(state==='listen'?'🎶 귀 기울여 들어요':mode==='free'?'나만의 음악을 만들어요!':'노란 건반을 하나씩 따라 쳐요',320,82);g.font='16px system-ui';g.fillText(mode==='rhythm'?'리듬 도전은 시작 버튼을 눌러요':'도 · 레 · 미 · 파 · 솔 · 라 · 시 · 도',320,117)}}
$('#piano').innerHTML=names.map((name,key)=>`<button class="key" data-key="${key}" aria-label="${name} 건반">${name}<small>${codes[key].slice(3)}</small></button>`).join('');pads=[...document.querySelectorAll('[data-key]')];for(const p of pads){p.addEventListener('pointerdown',e=>{e.preventDefault();p.setPointerCapture(e.pointerId);press(Number(p.dataset.key))});p.addEventListener('click',e=>{if(e.detail===0)press(Number(p.dataset.key))})}document.addEventListener('keydown',e=>{const key=codes.indexOf(e.code);if(key>=0&&!['SELECT','INPUT','TEXTAREA'].includes(e.target.tagName)){e.preventDefault();if(!e.repeat)press(key)}});for(const b of document.querySelectorAll('[data-mode]'))b.addEventListener('click',()=>{stop();mode=b.dataset.mode;for(const m of document.querySelectorAll('[data-mode]'))m.setAttribute('aria-pressed',String(m===b));$('#start').textContent=mode==='practice'?'▶ 따라 치기 시작':mode==='rhythm'?'▶ 리듬 도전 시작':'▶ 자유 연주 시작';$('#guide').textContent=mode==='practice'?'노란 건반을 따라 눌러요. 천천히 해도 괜찮아요!':mode==='rhythm'?'음표가 흰 선에 닿을 때 같은 이름의 건반을 눌러요.':'좋아하는 악기를 고르고 나만의 음악을 만들어요.';makeChart();paint();$('#status').textContent='악기를 고르고 시작해 볼까요?'});$('#start').addEventListener('click',()=>begin());$('#listen').addEventListener('click',()=>begin(true));$('#stop').addEventListener('click',()=>stop());$('#instrument').addEventListener('change',async()=>{try{await unlock();tone(2)}catch{}});$('#tempo').addEventListener('change',()=>{makeChart();paint()});document.addEventListener('visibilitychange',()=>{if(document.hidden)stop('잠깐 쉬어요. 시작 버튼으로 다시 연주할 수 있어요.');});window.addEventListener('blur',()=>{if(['playing','listen','free','starting'].includes(state))stop('잠깐 쉬어요. 시작 버튼으로 다시 연주할 수 있어요.')});makeChart();paint();requestAnimationFrame(tick);
</script></body></html>
