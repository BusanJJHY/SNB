<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#211c48"><title>공주님의 반짝 별나라</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#211c48;color:#fff5ff;font-family:system-ui,sans-serif;padding:12px;display:grid;place-items:center}main{width:min(480px,100%)}header{display:flex;justify-content:space-between;align-items:center;gap:8px}h1{font-size:clamp(21px,5vw,28px);margin:0;color:#ffcae9}header p{margin:4px 0;font-size:12px;color:#c2b8df}button{font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:14px;min-height:48px;padding:10px;touch-action:manipulation}button:focus-visible,select:focus-visible{outline:3px solid #ffde8d;outline-offset:3px}#sound{background:#3b315c;color:#fbe3ff;font-size:12px;min-height:40px;white-space:nowrap}.stats{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin:10px 0}.stats strong{color:#ffcf77}#hearts{color:#ff9fca}.board{display:flex;justify-content:center;border-radius:20px;background:#191535;padding:6px;box-shadow:0 8px 30px #120b2922}canvas{display:block;width:min(100%,calc(clamp(240px,calc(100svh - 245px),560px) * .75));height:auto;aspect-ratio:3/4;border-radius:15px;touch-action:none}.controls{display:grid;grid-template-columns:1fr 2fr 1fr;gap:8px;margin-top:10px}.controls button{color:#473865;background:#f0daff;touch-action:none;user-select:none;-webkit-user-select:none}.controls #start{background:#ffcfe7}.settings{display:flex;align-items:center;justify-content:center;gap:8px;margin:9px 0;font-size:12px;color:#c2b8df}select{background:#382d57;color:#fff;border:1px solid #63547f;border-radius:10px;font:inherit;padding:7px}.help{font-size:12px;text-align:center;line-height:1.6;color:#c2b8df;margin:8px 0}.help a{color:#ffcae9}#status{font-size:13px;min-height:20px;text-align:center;color:#ffe09d;margin:8px 0}button:disabled{opacity:.6}@media(max-width:600px){body{align-items:start;padding:10px 8px}.stats{font-size:12px}.controls button{min-height:48px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><main>
<header><div><h1>👑 공주님의 반짝 별나라</h1><p>별 마법으로 장난꾸러기 구름을 반짝반짝!</p></div><button id="sound" aria-pressed="false">🔇 소리 꺼짐</button></header><div class="stats"><strong id="score">별 점수 0</strong><span id="hearts" aria-label="하트 5개">♥ ♥ ♥ ♥ ♥</span><span id="wave">모험 1 / 5</span></div><div class="board"><canvas id="game" width="480" height="640" aria-label="공주가 별 마법을 쏘는 게임. 화면에서 손가락을 움직이거나 좌우 버튼으로 이동하세요. 별 마법은 자동으로 발사됩니다."></canvas></div><div class="controls"><button id="left" aria-label="왼쪽으로 이동">◀</button><button id="start">✨ 모험 시작</button><button id="right" aria-label="오른쪽으로 이동">▶</button></div><p id="status" role="status">공주님과 별나라를 구하러 가요!</p><div class="settings"><label for="difficulty">놀이 고르기</label><select id="difficulty"><option value="easy">🌷 천천히 · 하트 5개</option><option value="challenge">🌟 조금 빠르게 · 하트 3개</option></select><span id="best"></span></div><p class="help">폰: 화면에서 손가락을 움직여요 · 컴퓨터: ← → / A D<br>별 마법은 자동 발사! 💗는 하트, 🌟는 두 줄 별 마법<br><a href="../addition/">은별이 덧셈</a> · <a href="../multiply/">곱셈 정원</a> · <a href="../">점프게임</a></p>
</main><script>
const $=s=>document.querySelector(s),canvas=$('#game'),g=canvas.getContext('2d');let state='ready',player={x:240,y:563},stars=[],enemies=[],danger=[],gifts=[],particles=[],score=0,hearts=5,wave=1,best=0,time=0,shot=0,enemyShot=2.5,dive=7,shield=0,power=0,between=0,defeated=0,last=0,easy=true,sound=false,audio=null,drag=null,resumeState='playing';const keys={left:false,right:false};
try{best=Number(localStorage.getItem('princess-stars-best'))||0}catch{}
function stats(){$('#score').textContent=`별 점수 ${score}`;$('#hearts').textContent='♥ '.repeat(hearts)+'♡ '.repeat(Math.max(0,(easy?5:3)-hearts));$('#hearts').setAttribute('aria-label',`하트 ${hearts}개`);$('#wave').textContent=`모험 ${wave} / 5`;$('#best').textContent=`최고 ${best}`}
function chime(win=false){if(!sound||!audio||audio.state!=='running')return;[0,4,7,...(win?[12]:[])].forEach((n,i)=>{const at=audio.currentTime+i*.09,o=audio.createOscillator(),v=audio.createGain();o.type='sine';o.frequency.value=523.25*2**(n/12);v.gain.setValueAtTime(.06,at);v.gain.exponentialRampToValueAtTime(.0001,at+.18);o.connect(v);v.connect(audio.destination);o.start(at);o.stop(at+.2)})}
function createWave(){enemies=[];danger=[];stars=[];shield=3;enemyShot=2.5;dive=7;const rows=wave<=2?2:3;for(let row=0;row<rows;row++)for(let col=0;col<5;col++){if(wave===5&&row===0&&col!==2)continue;const boss=wave===5&&row===0;enemies.push({x:84+col*78,y:65+row*56,bx:84+col*78,by:65+row*56,w:boss?94:42,h:boss?50:28,hp:boss?10:1,boss,diving:false,color:['#d1b0f0','#a4d9ec','#f3cba5'][row]})}$('#status').textContent=wave===5?'👑 왕관 구름과 마지막 모험!':`✨ ${wave}번째 모험! 별 마법은 자동으로 나가요.`;stats()}
function start(){if(state==='paused'){state=resumeState;last=0;$('#start').textContent='↻ 처음부터';$('#status').textContent='✨ 다시 출발해요!';return}easy=$('#difficulty').value==='easy';state='playing';player={x:240,y:563};stars=[];danger=[];gifts=[];particles=[];score=0;hearts=easy?5:3;wave=1;time=0;shot=0;shield=3;power=0;defeated=0;last=0;keys.left=keys.right=false;$('#start').textContent='↻ 처음부터';$('#difficulty').disabled=true;createWave();stats()}
function finish(won){state=won?'won':'over';best=Math.max(best,score);try{localStorage.setItem('princess-stars-best',best)}catch{}$('#difficulty').disabled=false;$('#start').textContent='✨ 다시 모험';$('#status').textContent=won?'🎉 공주님이 별나라를 구했어요! 정말 멋져요!':'괜찮아요! 공주님과 다시 도전해 봐요 🌷';keys.left=keys.right=false;stats();if(won)chime(true)}
function hurt(){if(shield>0||state!=='playing')return;hearts--;shield=2.5;stats();$('#status').textContent='💗 잠깐 보호 마법! 천천히 움직여도 괜찮아요.';if(hearts<=0)finish(false)}
function sparkle(x,y,color){for(let i=0;i<10;i++)particles.push({x,y,vx:(Math.random()-.5)*130,vy:(Math.random()-.5)*130,life:.65,color})}
function update(dt){if(state!=='playing'&&state!=='between')return;time+=dt;particles=particles.map(p=>({...p,x:p.x+p.vx*dt,y:p.y+p.vy*dt,life:p.life-dt})).filter(p=>p.life>0);shield=Math.max(0,shield-dt);power=Math.max(0,power-dt);player.x=Math.max(28,Math.min(452,player.x+((keys.right?1:0)-(keys.left?1:0))*320*dt));if(state==='between'){between-=dt;if(between<=0){wave++;state='playing';createWave()}return}shot-=dt;if(shot<=0){for(const dx of power>0?[-11,11]:[0])stars.push({x:player.x+dx,y:player.y-25});shot=easy?.25:.21}stars.forEach(s=>s.y-=470*dt);for(const e of enemies){if(e.diving){e.y+=(easy?85:130)*dt;e.x+=Math.sin(time*2)*22*dt;if(e.y>665){e.diving=false;e.y=e.by}}else{e.x=e.bx+Math.sin(time*.8)*28;e.y=e.by+Math.sin(time*1.5+e.bx)*4}}
for(const s of stars){if(s.used)continue;const e=enemies.find(e=>e.hp>0&&Math.abs(s.x-e.x)<e.w/2+5&&Math.abs(s.y-e.y)<e.h/2+7);if(e){s.used=true;e.hp--;sparkle(s.x,s.y,'#ffdd86');if(e.hp<=0){score+=e.boss?200:10*wave;defeated++;if(defeated%5===0)gifts.push({x:e.x,y:e.y,kind:defeated%10===0?'heart':'magic'});stats();chime()}}}enemies=enemies.filter(e=>e.hp>0);stars=stars.filter(s=>!s.used&&s.y>-20);enemyShot-=dt;if(enemyShot<=0&&enemies.length){const e=enemies[Math.floor(Math.random()*enemies.length)];const dy=Math.max(80,player.y-e.y);danger.push({x:e.x,y:e.y+e.h/2,vx:Math.max(-55,Math.min(55,(player.x-e.x)/dy*100)),vy:easy?95+wave*6:150+wave*8});enemyShot=easy?2.4:1.3}dive-=dt;if(wave>=2&&dive<=0){const e=enemies.find(e=>!e.diving&&!e.boss);if(e)e.diving=true;dive=easy?8:5}for(const b of danger){b.x+=b.vx*dt;b.y+=b.vy*dt;if(Math.abs(b.x-player.x)<15&&Math.abs(b.y-player.y)<22){b.used=true;hurt()}}danger=danger.filter(b=>!b.used&&b.y<660&&b.x>-20&&b.x<500);for(const e of enemies)if(Math.abs(e.x-player.x)<e.w/2+12&&Math.abs(e.y-player.y)<e.h/2+20){hurt();e.diving=false;e.y=e.by}for(const gift of gifts){gift.y+=80*dt;if(Math.abs(gift.x-player.x)<29&&Math.abs(gift.y-player.y)<32){gift.used=true;if(gift.kind==='heart'){hearts=Math.min(easy?5:3,hearts+1);$('#status').textContent='💗 하트를 받았어요!'}else{power=8;$('#status').textContent='🌟 두 줄 별 마법! 8초 동안 더 반짝반짝!'}stats();chime()}}gifts=gifts.filter(p=>!p.used&&p.y<660);if(state==='playing'&&!enemies.length){if(wave===5)finish(true);else{state='between';between=2;danger=[];gifts=[];$('#status').textContent='🎉 잘했어요! 다음 모험으로 출발해요.'}}}
function star(x,y,r,color){g.beginPath();for(let i=0;i<10;i++){const angle=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;g.lineTo(x+Math.cos(angle)*rr,y+Math.sin(angle)*rr)}g.closePath();g.fillStyle=color;g.fill()}
function princess(){const x=player.x,y=player.y;g.save();g.translate(x,y);if(shield>0){g.strokeStyle='#aeeaff';g.lineWidth=3;g.beginPath();g.ellipse(0,0,38,48,0,0,Math.PI*2);g.stroke()}g.fillStyle='#785042';g.beginPath();g.ellipse(0,-17,20,24,0,0,Math.PI*2);g.fill();g.strokeStyle='#f2c4a6';g.lineWidth=7;g.lineCap='round';g.beginPath();g.moveTo(-11,6);g.lineTo(-23,14);g.moveTo(11,6);g.lineTo(24,-7);g.stroke();g.fillStyle='#f18dbc';g.beginPath();g.moveTo(-10,0);g.lineTo(10,0);g.lineTo(25,33);g.quadraticCurveTo(0,44,-25,33);g.closePath();g.fill();g.strokeStyle='#ffe6a3';g.lineWidth=4;g.beginPath();g.moveTo(-11,10);g.quadraticCurveTo(0,16,11,10);g.stroke();g.fillStyle='#f6d0b6';g.beginPath();g.ellipse(0,-17,15,18,0,0,Math.PI*2);g.fill();g.fillStyle='#785042';g.beginPath();g.moveTo(-16,-20);g.quadraticCurveTo(-9,-43,16,-26);g.lineTo(15,-18);g.quadraticCurveTo(5,-20,0,-31);g.quadraticCurveTo(-6,-20,-16,-20);g.fill();g.fillStyle='#523847';g.beginPath();g.arc(-5,-17,1.8,0,Math.PI*2);g.arc(6,-17,1.8,0,Math.PI*2);g.fill();g.strokeStyle='#af6475';g.lineWidth=1.5;g.beginPath();g.arc(1,-11,4,0,Math.PI);g.stroke();g.fillStyle='#ffdb7d';g.beginPath();g.moveTo(-12,-35);g.lineTo(-14,-46);g.lineTo(-5,-41);g.lineTo(0,-49);g.lineTo(6,-41);g.lineTo(14,-46);g.lineTo(12,-35);g.closePath();g.fill();g.strokeStyle='#ffdf8b';g.lineWidth=3;g.beginPath();g.moveTo(24,-7);g.lineTo(24,-23);g.stroke();star(24,-26,8,'#ffe09b');g.fillStyle='#e5a3d6';g.fillRect(-13,36,9,4);g.fillRect(4,36,9,4);g.restore()}
function cloud(e){g.save();g.translate(e.x,e.y);g.scale(e.w/42,e.h/28);g.fillStyle=e.color;g.beginPath();g.ellipse(0,3,21,11,0,0,Math.PI*2);g.arc(-10,-2,10,0,Math.PI*2);g.arc(2,-6,12,0,Math.PI*2);g.arc(12,-1,9,0,Math.PI*2);g.fill();g.fillStyle='#625482';g.beginPath();g.arc(-6,1,1.6,0,Math.PI*2);g.arc(7,1,1.6,0,Math.PI*2);g.fill();g.strokeStyle='#866382';g.lineWidth=1;g.beginPath();g.arc(1,5,3,0,Math.PI);g.stroke();if(e.boss){star(0,-21,7,'#ffe190');g.fillStyle='#fff';g.fillRect(-16,15,32*e.hp/10,2)}g.restore()}
function draw(){g.fillStyle='#241d4b';g.fillRect(0,0,480,640);for(let i=0;i<34;i++){const x=(i*131+37)%480,y=(i*79+time*9)%640;star(x,y,i%3===0?3:1.6,i%2?'#a694c9':'#e9d0e9')}g.fillStyle='#44345b';g.beginPath();g.arc(65,70,35,0,Math.PI*2);g.fill();g.fillStyle='#b69ac0';g.beginPath();g.arc(55,63,27,0,Math.PI*2);g.fill();if(state==='playing'||state==='between'){for(const e of enemies)cloud(e);for(const s of stars)star(s.x,s.y,8,'#ffe091');for(const b of danger){g.fillStyle='#eea4cb';g.beginPath();g.arc(b.x,b.y,7,0,Math.PI*2);g.fill();g.strokeStyle='#fff4ff';g.lineWidth=1.5;g.stroke()}for(const p of gifts){g.font='26px system-ui';g.textAlign='center';g.fillText(p.kind==='heart'?'💗':'🌟',p.x,p.y)}for(const p of particles)star(p.x,p.y,3*p.life,p.color)}princess();g.textAlign='center';if(state!=='playing'){g.fillStyle='#21183ae8';g.fillRect(36,221,408,145);g.fillStyle='#ffdd94';g.font='bold 28px system-ui';g.fillText(state==='won'?'별나라를 구했어요!':state==='over'?'다시 해 볼까요?':state==='between'?'참 잘했어요!':state==='paused'?'잠깐 쉬어요':'공주님의 별 마법',240,267);g.fillStyle='#ffe5f6';g.font='17px system-ui';g.fillText(state==='won'?`별 점수 ${score} · 멋진 공주님!`:state==='over'?`별 점수 ${score} · 다시 도전해요!`:state==='between'?'새로운 모험이 기다려요':state==='paused'?'준비되면 이어하기를 눌러 주세요':'좌우로 움직이면 별이 자동으로 나가요',240,305);g.font='14px system-ui';g.fillText(state==='between'?'잠시 뒤 출발!':'아래 모험 버튼을 눌러 주세요',240,338)}}
function frame(t){const dt=last?Math.min((t-last)/1000,.035):0;last=t;update(dt);draw();requestAnimationFrame(frame)}
const controlCodes=['ArrowLeft','ArrowRight','KeyA','KeyD'];document.addEventListener('keydown',e=>{if(controlCodes.includes(e.code)){e.preventDefault();keys[['ArrowLeft','KeyA'].includes(e.code)?'left':'right']=true}if(e.code==='Space'){e.preventDefault();if(!e.repeat&&['ready','won','over','paused'].includes(state))start()}});document.addEventListener('keyup',e=>{if(['ArrowLeft','KeyA'].includes(e.code))keys.left=false;if(['ArrowRight','KeyD'].includes(e.code))keys.right=false});for(const dir of ['left','right']){const b=$('#'+dir);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[dir]=true});for(const evt of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(evt,()=>keys[dir]=false)}function move(e){const r=canvas.getBoundingClientRect();player.x=Math.max(28,Math.min(452,(e.clientX-r.left)/r.width*480))}canvas.addEventListener('pointerdown',e=>{if(state!=='playing'&&state!=='between')return;e.preventDefault();drag=e.pointerId;canvas.setPointerCapture(e.pointerId);move(e)});canvas.addEventListener('pointermove',e=>{if(drag===e.pointerId)move(e)});for(const evt of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(evt,()=>drag=null);$('#start').addEventListener('click',start);$('#sound').addEventListener('click',async()=>{sound=!sound;if(sound){try{audio??=new(window.AudioContext||window.webkitAudioContext)();await audio.resume();chime()}catch{sound=false}}$('#sound').textContent=sound?'🔊 소리 켜짐':'🔇 소리 꺼짐';$('#sound').setAttribute('aria-pressed',String(sound))});function release(){keys.left=keys.right=false;drag=null;last=0;if(['playing','between'].includes(state)){resumeState=state;state='paused';$('#start').textContent='▶ 이어하기';$('#status').textContent='잠깐 쉬어요. 이어하기를 누르면 계속할 수 있어요.'}}window.addEventListener('blur',release);document.addEventListener('visibilitychange',()=>{if(document.hidden)release();else last=0});stats();requestAnimationFrame(frame);
</script></body></html>
