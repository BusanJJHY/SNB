<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101323"><title>BEAT POP — 드럼 리듬게임</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#101323;color:#f3f4ff;font-family:system-ui,sans-serif;padding:14px;display:grid;place-items:center}main{width:min(480px,100%)}header{display:flex;justify-content:space-between;align-items:center;gap:8px}h1{font-size:28px;margin:0;letter-spacing:-1px;color:#e5b6ff}header span{font-size:11px;color:#adb4d1}.stats{display:flex;justify-content:space-between;margin:10px 0;font-size:13px;font-weight:800}.config{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}.config label{font-size:11px;color:#adb4d1;min-width:0}.config select{display:block;width:100%;margin-top:3px;background:#252d47;color:#f3f4ff;border:1px solid #414d6c;border-radius:10px;font:inherit;font-size:12px;padding:8px;min-height:36px}.options{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11px;color:#adb4d1;margin:7px 0}.options label{display:flex;align-items:center;gap:5px}.options input[type=range]{width:90px;accent-color:#e5b6ff}.options input[type=checkbox]{accent-color:#e5b6ff}.canvaswrap{border-radius:16px;overflow:hidden;position:relative}canvas{display:block;width:100%;height:clamp(140px,calc(100svh - 390px),400px);border:1px solid #414d6c;border-radius:16px;background:#181d35;touch-action:pan-y}.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}button{font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:12px;min-height:54px;color:#101323;touch-action:manipulation}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #ffe19a;outline-offset:2px}.pads button{background:var(--color);touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 5px 0 color-mix(in srgb,var(--color),#000 40%);position:relative;font-size:18px}.pads small{display:block;font-size:10px;margin-top:1px}.pads button.active{filter:brightness(1.15);transform:translateY(4px);box-shadow:0 1px 0 #0004,0 0 18px var(--color)}.actions{display:flex;gap:8px;margin-top:13px}.actions button{flex:1;min-height:42px;background:#e5b6ff}#stop{background:#303954;color:white}button:disabled{opacity:.5;cursor:default}#status{font-size:12px;text-align:center;line-height:1.6;color:#f4d79d;min-height:20px;margin:9px 0}#summary{font-size:13px;line-height:1.7;text-align:center}.footer{font-size:11px;line-height:1.6;color:#adb4d1;text-align:center;margin:8px 0}.footer a{color:#e5b6ff}details{font-size:11px;color:#adb4d1;margin-top:6px}details p{line-height:1.6}#offset{width:80px;border:1px solid #414d6c;background:#252d47;color:white;padding:5px;border-radius:6px}.fever{color:#ffe391!important;text-shadow:0 0 12px #fa78c3}@media(max-width:600px){body{padding:10px;align-items:start}h1{font-size:24px}header span{font-size:10px}.pads button{min-height:52px}.stats{margin:8px 0}}@media(prefers-reduced-motion:reduce){.pads button.active{transform:none}}
</style></head><body><main>
<header><h1>BEAT POP ✦</h1><span id="songInfo"></span></header><div class="stats"><span id="score">점수 0</span><span id="combo">콤보 0</span><span id="best">최고 0</span></div>
<div class="config"><label for="song">🎵 곡 선택<select id="song"><option value="neon">Neon Bounce · 120 BPM</option><option value="bubble">Bubble Funk · 108 BPM</option><option value="star">Star Rush · 144 BPM</option><option value="parade">Drum Parade · 128 BPM</option></select></label><label for="mode">🥁 타격 소리<select id="mode"><option value="drum">드럼 · 킥 / 스네어 / 하이햇 / 탐</option><option value="classic">신스 · 반짝 전자음</option></select></label></div>
<div class="options"><label for="volume">음량 <input id="volume" type="range" min="0" max="100" value="65" aria-label="음량"></label><label for="effects"><input id="effects" type="checkbox" checked>강한 타격 효과</label><label for="haptic"><input id="haptic" type="checkbox">진동</label></div>
<div class="canvaswrap"><canvas id="game" width="480" height="460" aria-label="음표가 판정선에 닿을 때 해당 패드를 누르세요. D F J K로도 조작할 수 있습니다."></canvas></div><div class="pads"><button data-lane="0" style="--color:#71dce8" aria-label="D 킥">D<small>킥</small></button><button data-lane="1" style="--color:#ffc66d" aria-label="F 스네어">F<small>스네어</small></button><button data-lane="2" style="--color:#ffa5ca" aria-label="J 하이햇">J<small>하이햇</small></button><button data-lane="3" style="--color:#b5a0ff" aria-label="K 탐">K<small>탐</small></button></div>
<div class="actions"><button id="start">▶ 음악 시작</button><button id="stop" disabled>■ 중단</button></div><p id="status" role="status">곡을 고르고 시작! 20콤보마다 FEVER ×2!</p><div id="summary" aria-live="polite"></div><details><summary>판정 타이밍 조절</summary><p>소리에 맞춰 눌렀는데 늦게 잡힌다면 양수로 조절해 보세요. <label for="offset">보정 <input id="offset" type="number" min="-200" max="200" step="10" value="0"> ms</label><br>진동은 지원되는 기기에서 동작합니다.</p></details><p class="footer">D F J K / 화면 패드 · PERFECT ±75ms / GOOD ±160ms<br>4곡 모두 직접 만든 오리지널 음악 · 외부 음원·샘플 없음<br><a href="../">점프</a> · <a href="../racing/">레이싱</a> · <a href="../music/">음악학교</a></p>
</main><script>
const $=s=>document.querySelector(s),canvas=$('#game'),g=canvas.getContext('2d'),colors=['#71dce8','#ffc66d','#ffa5ca','#b5a0ff'],pads=[...document.querySelectorAll('[data-lane]')];
const songs={
 neon:{name:'Neon Bounce',bpm:120,bars:24,roots:[48,53,57,55],melody:[12,16,19,16,14,19,16,21],pattern:[0,1,2,3,2,1,0,3],style:'pop'},
 bubble:{name:'Bubble Funk',bpm:108,bars:16,roots:[45,50,48,52],melody:[12,15,19,22,19,15,17,19],pattern:[0,2,1,2,0,3,1,2],style:'funk'},
 star:{name:'Star Rush',bpm:144,bars:24,roots:[48,55,57,53],melody:[19,24,22,19,16,19,21,24],pattern:[0,3,1,2,3,0,2,1],style:'rush'},
 parade:{name:'Drum Parade',bpm:128,bars:20,roots:[43,48,50,46],melody:[12,19,17,14,12,17,19,22],pattern:[0,2,1,2,3,3,1,2],style:'march'}
};
const WINDOW=.16,LEAD=1.7,RECORD_KEY='beat-pop-records-v2';let song=songs.neon,beat=.5,length=48,soundMode='drum',audio=null,master=null,musicBus=null,sfxBus=null,noise=null,base=0,nextStep=0,state='ready',notes=[],score=0,combo=0,maxCombo=0,perfect=0,good=0,miss=0,best=0,records={},judgment='',judgeUntil=0,flashes=[0,0,0,0],particles=[],rings=[],pops=[],shake=0,feverUntil=0,lastFrame=0,padUntil=[0,0,0,0],generation=0;
const reduced=matchMedia('(prefers-reduced-motion: reduce)');$('#effects').checked=!reduced.matches;
try{const saved=JSON.parse(localStorage.getItem(RECORD_KEY));for(const id of Object.keys(songs))for(const mode of ['classic','drum']){const key=id+':'+mode;if(saved&&Number.isSafeInteger(saved[key])&&saved[key]>=0)records[key]=saved[key]}const legacy=Number(localStorage.getItem('beat-pop-best'))||0;if(legacy>0)records['neon:classic']=Math.max(legacy,records['neon:classic']||0)}catch{}
function recordId(){return $('#song').value+':'+$('#mode').value}
function selectSong(){song=songs[$('#song').value];beat=60/song.bpm;length=song.bars*4*beat;soundMode=$('#mode').value;best=records[recordId()]||0;$('#songInfo').textContent=`${song.bpm} BPM · ${Math.round(length)}초`;const labels=soundMode==='drum'?['킥','스네어','하이햇','탐']:['베이스','코드','벨','리드'];pads.forEach((p,i)=>{p.querySelector('small').textContent=labels[i];p.setAttribute('aria-label','DFJK'[i]+' '+labels[i])});updateStats()}
function updateStats(){$('#score').textContent=`점수 ${score.toLocaleString()}`;$('#combo').textContent=`콤보 ${combo}`;$('#best').textContent=`최고 ${best.toLocaleString()}`;$('#combo').classList.toggle('fever',!!audio&&feverUntil>audio.currentTime)}
function chart(track=song){const b=60/track.bpm,result=[];for(let n=0;n<track.bars*4;n++){result.push({time:n*b,lane:track.pattern[n%8],done:false});if(track.style==='pop'&&n>=16&&n%4===3||track.style==='funk'&&n%4===2||track.style==='rush'&&n%2===1||track.style==='march'&&n%8===7)result.push({time:(n+.5)*b,lane:(track.pattern[n%8]+2)%4,done:false})}return result.sort((a,b)=>a.time-b.time)}
function freq(m){return 440*2**((m-69)/12)}
function tone(at,midi,duration,type,volume,bus=musicBus){const o=audio.createOscillator(),v=audio.createGain();o.type=type;o.frequency.value=freq(midi);v.gain.setValueAtTime(.0001,at);v.gain.linearRampToValueAtTime(volume,at+.004);v.gain.exponentialRampToValueAtTime(.0001,at+duration);o.connect(v);v.connect(bus);o.onended=()=>{o.disconnect();v.disconnect()};o.start(at);o.stop(at+duration+.015)}
function kick(at,volume=.65,bus=musicBus){const o=audio.createOscillator(),v=audio.createGain();o.frequency.setValueAtTime(180,at);o.frequency.exponentialRampToValueAtTime(43,at+.14);v.gain.setValueAtTime(volume,at);v.gain.exponentialRampToValueAtTime(.0001,at+.28);o.connect(v);v.connect(bus);o.onended=()=>{o.disconnect();v.disconnect()};o.start(at);o.stop(at+.3)}
function noiseHit(at,kind='hat',volume=.15,bus=musicBus){const src=audio.createBufferSource(),filter=audio.createBiquadFilter(),v=audio.createGain();src.buffer=noise;filter.type='highpass';filter.frequency.value=kind==='snare'?950:kind==='clap'?1700:6500;const duration=kind==='snare'?.17:kind==='clap'?.1:.055;v.gain.setValueAtTime(volume,at);v.gain.exponentialRampToValueAtTime(.0001,at+duration);src.connect(filter);filter.connect(v);v.connect(bus);src.onended=()=>{src.disconnect();filter.disconnect();v.disconnect()};src.start(at);src.stop(at+duration+.01)}
function tom(at,bus=sfxBus){const o=audio.createOscillator(),v=audio.createGain();o.frequency.setValueAtTime(230,at);o.frequency.exponentialRampToValueAtTime(105,at+.17);v.gain.setValueAtTime(.55,at);v.gain.exponentialRampToValueAtTime(.0001,at+.24);o.connect(v);v.connect(bus);o.onended=()=>{o.disconnect();v.disconnect()};o.start(at);o.stop(at+.25)}
function hitSound(lane,success=false){const at=audio.currentTime;if(soundMode==='drum'){if(lane===0)kick(at,.85,sfxBus);else if(lane===1){noiseHit(at,'snare',.5,sfxBus);tone(at,50,.1,'triangle',.25,sfxBus)}else if(lane===2)noiseHit(at,'hat',.35,sfxBus);else tom(at)}else{tone(at,[48,64,79,72][lane],.16,lane===0?'triangle':'sine',.35,sfxBus);noiseHit(at,'clap',.12,sfxBus)}if(success)tone(at,96+lane*2,.045,'sine',.045,sfxBus)}
// Four original compositions, generated with oscillators and locally generated noise.
function musicStep(step){const at=base+step*beat/2,b=Math.floor(step/2),bar=Math.floor(b/4),root=song.roots[Math.floor(bar/2)%4];if(soundMode==='classic'){noiseHit(at,'hat',.09);if(step%2===0){kick(at,.48);if(b%2===1)noiseHit(at,'snare',.22)}}else if(step%8===0)noiseHit(at,'hat',.055);if(step%2===0)tone(at,root,beat*.55,'triangle',song.style==='funk'?.25:.2);if(song.style==='funk'&&step%4===3)tone(at,root+12,.12,'triangle',.11);if(step%8===0)for(const interval of [0,4,7])tone(at,root+12+interval,beat*3,'triangle',.05);if(step%2===0||song.style==='rush'||song.style==='march'&&step%8>=6)tone(at,root+song.melody[step%8],beat*.38,song.style==='rush'?'sawtooth':song.style==='funk'?'triangle':'square',song.style==='rush'?.032:.05)}
function lock(playing){$('#song').disabled=$('#mode').disabled=playing;$('#start').disabled=playing;$('#stop').disabled=!playing}
async function start(){if(['starting','playing'].includes(state))return;const run=++generation;state='starting';lock(true);try{if(audio&&audio.state!=='closed')await audio.close();if(run!==generation)return;const ctx=new(window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});audio=ctx;await ctx.resume();if(run!==generation){if(ctx.state!=='closed')await ctx.close();return}master=audio.createGain();musicBus=audio.createGain();sfxBus=audio.createGain();master.gain.value=Number($('#volume').value)/100;musicBus.gain.value=.46;sfxBus.gain.value=.78;const compressor=audio.createDynamicsCompressor();compressor.threshold.value=-12;compressor.knee.value=12;compressor.ratio.value=8;compressor.attack.value=.003;compressor.release.value=.12;musicBus.connect(master);sfxBus.connect(master);master.connect(compressor);compressor.connect(audio.destination);noise=audio.createBuffer(1,Math.ceil(audio.sampleRate*.25),audio.sampleRate);const samples=noise.getChannelData(0);for(let i=0;i<samples.length;i++)samples[i]=Math.random()*2-1;selectSong();base=audio.currentTime+2;nextStep=0;notes=chart();score=combo=maxCombo=perfect=good=miss=0;flashes=[0,0,0,0];padUntil=[0,0,0,0];particles=[];rings=[];pops=[];shake=feverUntil=0;judgment='';lastFrame=0;state='playing';$('#summary').textContent='';$('#status').textContent='준비! 2초 뒤 시작합니다.';updateStats()}catch{if(run!==generation)return;state='ready';lock(false);$('#status').textContent='소리를 시작하지 못했어요. 시작 버튼으로 다시 시도하세요.';if(audio){await audio.close().catch(()=>{});audio=null}}}
function impact(lane,exact,now){const strong=$('#effects').checked&&!reduced.matches,x=lane*120+60,y=390;flashes[lane]=now+(exact?.22:.15);rings.push({x,y,life:.45,max:.45,color:colors[lane]});for(let i=0;i<(strong?exact?24:12:5);i++){const a=Math.random()*Math.PI*2,s=70+Math.random()*240;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-80,life:.35+Math.random()*.3,color:colors[lane]})}particles=particles.slice(-250);rings=rings.slice(-16);if(strong)shake=Math.max(shake,exact?5:2);if($('#haptic').checked&&navigator.vibrate)navigator.vibrate(exact?18:10)}
function hit(lane){if(state!=='playing')return;const now=audio.currentTime,t=now-base-Math.max(-200,Math.min(200,Number($('#offset').value)||0))/1000;padUntil[lane]=now+.11;pads[lane].classList.add('active');const n=notes.filter(n=>!n.done&&n.lane===lane&&Math.abs(n.time-t)<=WINDOW).sort((a,b)=>Math.abs(a.time-t)-Math.abs(b.time-t))[0];hitSound(lane,!!n);if(!n){flashes[lane]=now+.07;return}n.done=true;const exact=Math.abs(n.time-t)<=.075;if(exact)perfect++;else good++;combo++;maxCombo=Math.max(maxCombo,combo);if(combo%20===0){feverUntil=now+5;pops.push({text:combo+' COMBO · FEVER!',life:1.15})}else if(combo%10===0)pops.push({text:combo+' COMBO!',life:.85});score+=((exact?100:60)+Math.min(combo,50)*2)*(feverUntil>now?2:1);judgment=exact?'PERFECT!':'GOOD';judgeUntil=now+.42;impact(lane,exact,now);updateStats()}
function finish(completed){generation++;state=completed?'finished':'ready';lock(false);$('#start').textContent='↻ 다시 도전';if(completed){best=Math.max(best,score);records[recordId()]=best;try{localStorage.setItem(RECORD_KEY,JSON.stringify(records));if(recordId()==='neon:classic')localStorage.setItem('beat-pop-best',best)}catch{}const accuracy=(perfect+good*.65)/notes.length,grade=accuracy>=.95?'S':accuracy>=.8?'A':accuracy>=.6?'B':'C';$('#summary').textContent=`${grade} 등급 · 최대 콤보 ${maxCombo} · PERFECT ${perfect} / GOOD ${good} / MISS ${miss}`;$('#status').textContent='완주! 곡과 모드를 바꿔 다시 도전해요.'}else{$('#summary').textContent='';$('#status').textContent='중단했어요. 시작 버튼으로 다시 도전하세요.'}if(master&&audio){master.gain.setValueAtTime(0,audio.currentTime);audio.suspend().catch(()=>{})}pads.forEach(p=>p.classList.remove('active'));updateStats()}
function tick(timestamp){const dt=lastFrame?Math.min((timestamp-lastFrame)/1000,.04):0;lastFrame=timestamp;particles=particles.map(p=>({...p,x:p.x+p.vx*dt,y:p.y+p.vy*dt,vy:p.vy+350*dt,life:p.life-dt})).filter(p=>p.life>0);rings.forEach(r=>r.life-=dt);rings=rings.filter(r=>r.life>0);pops.forEach(p=>p.life-=dt);pops=pops.filter(p=>p.life>0);shake=Math.max(0,shake-dt*32);if(state==='playing'){const now=audio.currentTime,t=now-base,offset=Math.max(-200,Math.min(200,Number($('#offset').value)||0))/1000;while(nextStep<song.bars*8&&base+nextStep*beat/2<now+.12)musicStep(nextStep++);for(const n of notes)if(!n.done&&t-offset-n.time>WINDOW){n.done=true;miss++;combo=0;feverUntil=0;judgment='MISS';judgeUntil=now+.3;updateStats()}pads.forEach((p,i)=>p.classList.toggle('active',padUntil[i]>now));if(t>=length+.65)finish(true);else $('#status').textContent=t<0?`준비 ${Math.ceil(-t)}…`:feverUntil>now?`🔥 FEVER ×2 · ${Math.ceil(feverUntil-now)}초 · 남은 곡 ${Math.max(0,Math.ceil(length-t))}초`:`${song.name} · 남은 ${Math.max(0,Math.ceil(length-t))}초`;$('#combo').classList.toggle('fever',feverUntil>now)}draw(timestamp||0);requestAnimationFrame(tick)}
function draw(timestamp){const now=audio?audio.currentTime:0,t=now-base,target=390,fever=state==='playing'&&feverUntil>now,strong=$('#effects').checked&&!reduced.matches;g.clearRect(0,0,480,460);g.save();if(strong&&shake>0)g.translate(Math.sin(timestamp*.07)*shake,Math.cos(timestamp*.06)*shake*.5);g.fillStyle=fever?'#2b2140':'#151a2e';g.fillRect(-8,-8,496,476);for(let lane=0;lane<4;lane++){g.fillStyle=lane%2?'#202640':'#181d35';g.fillRect(lane*120+2,0,116,460);if(flashes[lane]>now&&state==='playing'){const beam=g.createLinearGradient(0,0,0,460);beam.addColorStop(0,colors[lane]+'00');beam.addColorStop(1,colors[lane]+'88');g.fillStyle=beam;g.fillRect(lane*120+2,0,116,460)}g.strokeStyle=colors[lane]+'44';g.lineWidth=1;g.strokeRect(lane*120+1,0,118,460);g.shadowColor=colors[lane];g.shadowBlur=flashes[lane]>now?20:6;g.fillStyle=colors[lane];g.fillRect(lane*120+12,target-6,96,12);g.shadowBlur=0}g.fillStyle='#ffffff';g.fillRect(0,target,480,2);if(state==='playing')for(const n of notes){if(n.done)continue;const y=target-(n.time-t)/LEAD*target;if(y<-30||y>470)continue;g.fillStyle=colors[n.lane];if(strong||fever){g.fillStyle=colors[n.lane]+'22';g.fillRect(n.lane*120+20,y-40,80,30)}g.shadowColor=colors[n.lane];g.shadowBlur=fever?15:5;g.fillStyle=colors[n.lane];g.fillRect(n.lane*120+14,y-10,92,20);g.shadowBlur=0;g.fillStyle='#ffffff99';g.fillRect(n.lane*120+20,y-8,80,4)}for(const r of rings){g.globalAlpha=r.life/r.max;g.strokeStyle=r.color;g.lineWidth=3;g.beginPath();g.ellipse(r.x,r.y,12+(1-r.life/r.max)*65,6+(1-r.life/r.max)*25,0,0,Math.PI*2);g.stroke()}g.globalAlpha=1;for(const p of particles){g.globalAlpha=Math.min(1,p.life*3);g.fillStyle=p.color;g.fillRect(p.x-2,p.y-2,4,4)}g.globalAlpha=1;g.textAlign='center';if(state!=='playing'){g.fillStyle='#e5b6ff';g.font='bold 30px system-ui';g.fillText(state==='finished'?'NICE PLAY!':'FEEL THE IMPACT',240,170);g.fillStyle='#d0d6f0';g.font='17px system-ui';g.fillText(song.name+' · '+song.bpm+' BPM',240,205);g.font='14px system-ui';g.fillText(soundMode==='drum'?'내 손으로 드럼을 연주해요':'색깔 패드로 비트를 두드려요',240,235)}else{if(judgeUntil>now){const progress=Math.max(0,(judgeUntil-now)/.42),scale=1+progress*.12;g.save();g.translate(240,165);g.scale(scale,scale);g.fillStyle=judgment==='MISS'?'#ff8eab':judgment==='PERFECT!'?'#fff2bb':'#fff';g.shadowColor=judgment==='MISS'?'#ff8eab':'#ffcfa3';g.shadowBlur=strong?12:0;g.font='900 28px system-ui';g.fillText(judgment,0,0);g.restore()}if(combo>1){g.fillStyle=fever?'#ffe391':'#ffffff';g.font='900 42px system-ui';g.fillText(combo,240,218);g.font='bold 12px system-ui';g.fillText(fever?'COMBO · FEVER ×2':'COMBO',240,239)}if(pops.length){const p=pops.at(-1);g.fillStyle='#ffdc89';g.font='bold 19px system-ui';g.fillText(p.text,240,290-Math.max(0,1-p.life)*16)}}g.restore()}
$('#start').addEventListener('click',start);$('#stop').addEventListener('click',()=>{if(['starting','playing'].includes(state))finish(false)});for(const id of ['song','mode'])$('#'+id).addEventListener('change',()=>{score=combo=0;feverUntil=0;state='ready';notes=[];$('#summary').textContent='';$('#status').textContent='곡을 고르고 시작! 20콤보마다 FEVER ×2!';selectSong()});$('#volume').addEventListener('input',()=>{if(master&&audio&&audio.state!=='closed')master.gain.setTargetAtTime(Number($('#volume').value)/100,audio.currentTime,.02)});const codes=['KeyD','KeyF','KeyJ','KeyK'];document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;const lane=codes.indexOf(e.code);if(lane>=0){e.preventDefault();if(!e.repeat)hit(lane)}});document.addEventListener('keyup',e=>{const lane=codes.indexOf(e.code);if(lane>=0)pads[lane].classList.remove('active')});for(const p of pads){p.addEventListener('pointerdown',e=>{e.preventDefault();p.setPointerCapture(e.pointerId);hit(Number(p.dataset.lane))});for(const evt of ['pointerup','pointercancel','lostpointercapture'])p.addEventListener(evt,()=>p.classList.remove('active'));p.addEventListener('click',e=>{if(e.detail===0)hit(Number(p.dataset.lane))})}document.addEventListener('visibilitychange',()=>{if(document.hidden&&['playing','starting'].includes(state))finish(false)});window.addEventListener('blur',()=>{if(['playing','starting'].includes(state))finish(false);pads.forEach(p=>p.classList.remove('active'))});selectSong();requestAnimationFrame(tick);
</script></body></html>
