<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BEAT POP — 리듬게임</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#101323;color:#f3f4ff;font-family:system-ui,sans-serif;padding:16px;display:grid;place-items:center}main{width:min(480px,100%)}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:28px;letter-spacing:-1px;margin:0;color:#e5b6ff}header span{font-size:12px;color:#adb4d1}.stats{display:flex;justify-content:space-between;margin:12px 0;font-weight:700;font-size:14px}canvas{display:block;width:100%;height:clamp(180px,calc(100svh - 290px),460px);border:1px solid #394062;border-radius:16px;background:#181d35;touch-action:pan-y}.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}button{cursor:pointer;font:inherit;font-weight:800;border:0;border-radius:12px;color:#101323;min-height:56px;touch-action:manipulation}button:focus-visible{outline:3px solid white;outline-offset:3px}.pads button{background:var(--color);touch-action:none;user-select:none;-webkit-user-select:none}.pads button.active{filter:brightness(1.4);transform:translateY(3px)}.actions{display:flex;gap:8px;margin-top:10px}.actions button{flex:1;background:#e5b6ff;min-height:44px}.actions #stop{background:#303954;color:#f3f4ff}p{font-size:12px;line-height:1.6;color:#adb4d1;text-align:center;margin:8px 0}#status{color:#fff;min-height:20px}a{color:#e5b6ff}#summary{font-size:14px;font-weight:700}button:disabled{opacity:.5;cursor:default}@media(max-width:600px){body{padding:10px;align-items:start}h1{font-size:24px}.stats{margin:8px 0}.pads button{min-height:54px}}
</style></head><body><main><header><h1>BEAT POP ✦</h1><span>오리지널 신스팝 · 120 BPM</span></header><div class="stats"><span id="score">점수 0</span><span id="combo">콤보 0</span><span id="best">최고 0</span></div><canvas id="game" width="480" height="460" aria-label="내려오는 노트가 흰 판정선에 닿을 때 해당 색의 패드를 누르세요"></canvas><div class="pads"><button data-lane="0" style="--color:#71dce8" aria-label="첫 번째 레인 D">D</button><button data-lane="1" style="--color:#ffc66d" aria-label="두 번째 레인 F">F</button><button data-lane="2" style="--color:#ffa5ca" aria-label="세 번째 레인 J">J</button><button data-lane="3" style="--color:#b5a0ff" aria-label="네 번째 레인 K">K</button></div><div class="actions"><button id="start">▶ 음악 시작</button><button id="stop" disabled>■ 중단</button></div><p id="status" role="status">소리를 켜고 시작! 흰 선에 닿을 때 두드려요.</p><div id="summary" aria-live="polite"></div><p>D F J K 또는 화면 패드 · PERFECT / GOOD · 콤보 도전<br>「Neon Bounce」 — 이 게임용으로 만든 오리지널 전자음악<br>외부 음원·샘플 없이 브라우저에서 연주합니다.<br><a href="../">점프게임</a> · <a href="../racing/">레이싱게임</a></p></main>
<script>
const $=s=>document.querySelector(s),canvas=$('#game'),g=canvas.getContext('2d'),colors=['#71dce8','#ffc66d','#ffa5ca','#b5a0ff'],pads=[...document.querySelectorAll('[data-lane]')];
const BEAT=.5,BARS=24,LENGTH=BARS*4*BEAT,LEAD=1.8,WINDOW=.16;let audio=null,master=null,noise=null,base=0,nextStep=0,state='ready',notes=[],score=0,combo=0,maxCombo=0,perfect=0,good=0,miss=0,best=0,judgment='',judgeUntil=0,flashes=[0,0,0,0];
try{best=Number(localStorage.getItem('beat-pop-best'))||0}catch{}
function updateStats(){$('#score').textContent=`점수 ${score.toLocaleString()}`;$('#combo').textContent=`콤보 ${combo}`;$('#best').textContent=`최고 ${best.toLocaleString()}`}
function chart(){const result=[];const lanes=[0,1,2,3,2,1,0,3];for(let b=0;b<BARS*4;b++){result.push({time:b*BEAT,lane:lanes[b%8],done:false});if(b>=16&&b%4===3)result.push({time:(b+.5)*BEAT,lane:(lanes[b%8]+2)%4,done:false})}return result}
function frequency(midi){return 440*2**((midi-69)/12)}
function tone(at,midi,duration,type,volume){const o=audio.createOscillator(),v=audio.createGain();o.type=type;o.frequency.value=frequency(midi);v.gain.setValueAtTime(0,at);v.gain.linearRampToValueAtTime(volume,at+.008);v.gain.exponentialRampToValueAtTime(.0001,at+duration);o.connect(v);v.connect(master);o.start(at);o.stop(at+duration+.02)}
function kick(at){const o=audio.createOscillator(),v=audio.createGain();o.frequency.setValueAtTime(145,at);o.frequency.exponentialRampToValueAtTime(42,at+.15);v.gain.setValueAtTime(.45,at);v.gain.exponentialRampToValueAtTime(.0001,at+.23);o.connect(v);v.connect(master);o.start(at);o.stop(at+.25)}
function drum(at,snare){const src=audio.createBufferSource(),filter=audio.createBiquadFilter(),v=audio.createGain();src.buffer=noise;filter.type='highpass';filter.frequency.value=snare?1100:6500;v.gain.setValueAtTime(snare?.17:.065,at);v.gain.exponentialRampToValueAtTime(.0001,at+(snare?.13:.045));src.connect(filter);filter.connect(v);v.connect(master);src.start(at);src.stop(at+.16)}
// Original melody and arrangement: no downloaded recordings or samples.
function musicStep(step){const at=base+step*.25,beat=Math.floor(step/2),bar=Math.floor(beat/4),root=[48,53,57,55][Math.floor(bar/2)%4];drum(at,false);if(step%2===0){kick(at);tone(at,root, .22,'triangle',.2);if(beat%2===1)drum(at,true)}if(step%8===0)for(const interval of [0,4,7])tone(at,root+12+interval,1.5,'triangle',.045);const motif=[12,16,19,16,14,19,16,21];if(step%2===0||bar>=4&&step%8===7)tone(at,root+motif[step%8],.18,'square',.045)}
async function start(){if(state==='starting'||state==='playing')return;state='starting';$('#start').disabled=true;try{if(audio)await audio.close();audio=new(window.AudioContext||window.webkitAudioContext)();await audio.resume();master=audio.createGain();master.gain.value=.48;master.connect(audio.destination);noise=audio.createBuffer(1,Math.ceil(audio.sampleRate*.2),audio.sampleRate);const data=noise.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;base=audio.currentTime+2;nextStep=0;notes=chart();score=combo=maxCombo=perfect=good=miss=0;flashes=[0,0,0,0];judgment='';state='playing';$('#stop').disabled=false;$('#summary').textContent='';$('#status').textContent='준비! 2초 뒤 시작합니다.';updateStats()}catch(e){state='ready';$('#start').disabled=false;$('#status').textContent='소리를 시작하지 못했어요. 시작 버튼을 다시 눌러주세요.';if(audio){await audio.close().catch(()=>{});audio=null}}}
function hit(lane){if(state!=='playing')return;const t=audio.currentTime-base;flashes[lane]=audio.currentTime+.12;const n=notes.find(n=>!n.done&&n.lane===lane&&Math.abs(n.time-t)<=WINDOW);if(!n)return;n.done=true;const exact=Math.abs(n.time-t)<=.075;if(exact)perfect++;else good++;combo++;maxCombo=Math.max(maxCombo,combo);score+=(exact?100:60)+Math.min(combo,50)*2;judgment=exact?'PERFECT!':'GOOD';judgeUntil=audio.currentTime+.5;updateStats()}
function finish(completed){state=completed?'finished':'ready';$('#start').disabled=false;$('#start').textContent='↻ 다시 도전';$('#stop').disabled=true;if(completed){best=Math.max(best,score);try{localStorage.setItem('beat-pop-best',best)}catch{}$('#summary').textContent=`최대 콤보 ${maxCombo} · PERFECT ${perfect} · GOOD ${good} · MISS ${miss}`;$('#status').textContent='완주! 다시 최고 기록에 도전해보세요.'}else{$('#status').textContent='중단했어요. 시작 버튼으로 다시 도전하세요.';$('#summary').textContent=''}if(master)master.gain.setValueAtTime(0,audio.currentTime);if(audio)audio.suspend().catch(()=>{});updateStats()}
function tick(){if(state==='playing'){const now=audio.currentTime,t=now-base;while(nextStep<BARS*8&&base+nextStep*.25<now+.15)musicStep(nextStep++);for(const n of notes){if(!n.done&&t-n.time>WINDOW){n.done=true;miss++;combo=0;judgment='MISS';judgeUntil=now+.35;updateStats()}}if(t>=LENGTH+.6)finish(true);else $('#status').textContent=t<0?`준비 ${Math.ceil(-t)}…`:`남은 시간 ${Math.max(0,Math.ceil(LENGTH-t))}초 · 박자에 맞춰 두드려요!`}draw();requestAnimationFrame(tick)}
function draw(){const w=480,h=460,target=h-70,t=audio?audio.currentTime-base:-2;g.clearRect(0,0,w,h);for(let lane=0;lane<4;lane++){g.fillStyle=audio&&flashes[lane]>audio.currentTime?colors[lane]+'55':lane%2?'#202640':'#181d35';g.fillRect(lane*120+2,0,116,h);g.fillStyle='#394062';g.fillRect(lane*120,0,1,h);g.fillStyle=colors[lane];g.fillRect(lane*120+12,target-6,96,12)}g.fillStyle='#ffffff';g.fillRect(0,target,480,2);if(state==='playing')for(const n of notes){if(n.done)continue;const y=target-(n.time-t)/LEAD*target;if(y<-25||y>h)continue;g.fillStyle=colors[n.lane];g.fillRect(n.lane*120+14,y-10,92,20);g.fillStyle='#ffffff55';g.fillRect(n.lane*120+20,y-8,80,4)}g.textAlign='center';if(state!=='playing'){g.fillStyle='#e5b6ff';g.font='bold 32px system-ui';g.fillText(state==='finished'?'NICE PLAY!':'FEEL THE BEAT',240,170);g.fillStyle='#d0d6f0';g.font='16px system-ui';g.fillText('시작 버튼을 누르고 박자를 느껴요',240,208)}else if(judgeUntil>audio.currentTime){g.fillStyle=judgment==='MISS'?'#ff8eab':'#ffffff';g.font='bold 26px system-ui';g.fillText(judgment,240,180);if(combo>1){g.font='bold 38px system-ui';g.fillText(combo+' COMBO',240,230)}}}
$('#start').addEventListener('click',start);$('#stop').addEventListener('click',()=>{if(state==='playing')finish(false)});const codes=['KeyD','KeyF','KeyJ','KeyK'];document.addEventListener('keydown',e=>{const lane=codes.indexOf(e.code);if(lane>=0){e.preventDefault();if(!e.repeat)hit(lane)}});for(const p of pads){p.addEventListener('pointerdown',e=>{e.preventDefault();p.setPointerCapture(e.pointerId);p.classList.add('active');hit(Number(p.dataset.lane))});for(const evt of ['pointerup','pointercancel','lostpointercapture'])p.addEventListener(evt,()=>p.classList.remove('active'))}document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')finish(false)});window.addEventListener('blur',()=>{if(state==='playing')finish(false);pads.forEach(p=>p.classList.remove('active'))});updateStats();requestAnimationFrame(tick);
</script></body></html>
