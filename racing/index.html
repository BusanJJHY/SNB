<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RETRO RACER</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#121827;color:#ecf5ff;font-family:monospace;display:grid;place-items:center;padding:16px}main{width:min(420px,100%)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}h1{font-size:24px;margin:0;color:#ffcc64}header span{color:#97a9c0;font-size:12px}canvas{width:100%;display:block;aspect-ratio:420/600;border:4px solid #3b4961;border-radius:8px;image-rendering:pixelated;touch-action:none}.stats{display:flex;justify-content:space-between;margin:12px 0;font-size:15px}.controls{display:flex;gap:10px}button{background:#26364c;color:#fff;border:1px solid #465973;border-radius:10px;min-height:54px;font: bold 18px monospace;cursor:pointer;touch-action:none;flex:1}#start{flex:2;background:#ffcc64;color:#24262b}button:active{background:#526984}p{color:#97a9c0;text-align:center;font-size:12px;line-height:1.7}a{color:#ffcc64}button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.shop{margin-top:14px;padding:16px;background:#1d293b;border:1px solid #465973;border-radius:12px}.shop h2{margin:0 0 8px;font-size:18px}.shop p{text-align:left;margin:8px 0}.shop button{width:100%;font-size:15px}#bomb{width:100%;margin-top:10px;background:#b94240}button:disabled{opacity:.5;cursor:default}#notice{min-height:20px;color:#ffcc64}

.controls{display:grid;grid-template-columns:1fr 1.5fr 1fr 1.5fr;gap:6px;margin-top:10px}.controls button{min-width:0;padding:6px;font-size:13px}#bomb{width:auto;margin-top:0}.shop details{margin:8px 0;color:#97a9c0;font-size:12px}.shop summary{cursor:pointer}
@media(max-width:600px){
 body{padding:10px;align-items:start}header{margin-bottom:6px}h1{font-size:21px}.stats{margin:6px 0;font-size:13px}
 canvas{height:clamp(150px,calc(100svh - 345px),430px);width:auto;max-width:100%;margin:auto;object-fit:contain;background:#245c47}
 .controls button{min-height:48px}.shop{margin-top:8px;padding:10px}.shop h2{font-size:15px;margin-bottom:5px}.shop button{min-height:44px}.shop p{margin:5px 0}#notice{font-size:12px;line-height:1.4;min-height:17px}main>p{margin:8px 0;font-size:11px}
}
</style></head><body><main><header><h1>RETRO RACER</h1><span>끝없이 달려라</span></header><div class="stats"><span id="score">거리 0 m</span><span id="best">최고 0 m</span></div><canvas id="game" width="420" height="600" aria-label="좌우 방향키 또는 아래 버튼으로 차를 움직여 다른 차를 피하세요."></canvas><div class="controls"><button id="left" aria-label="왼쪽으로 이동">◀</button><button id="start">시작 / 재도전</button><button id="right" aria-label="오른쪽으로 이동">▶</button><button id="bomb">💥 폭탄 사용 · B키</button></div><section class="shop" aria-label="아이템 상점"><h2>🛒 피트 스톱 상점</h2><div id="wallet"></div><details><summary>아이템 설명 / 코인 얻는 법</summary><p>폭탄: 화면 안의 앞쪽 차를 모두 파괴합니다.<br>50 m마다 코인 10개 · 첫 방문 코인 30개 선물!</p></details><button id="buy">폭탄 1개 구매 · 🪙 20</button><p id="notice" role="status">출발 전 폭탄을 챙겨보세요.</p></section><p>← → 또는 A D로 이동 · 스페이스바로 시작<br>차를 피할수록 속도가 올라갑니다.<br><a href="../">점프게임</a> · <a href="../rhythm/">리듬게임</a></p></main>
<script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
let state='ready',player={x:189,y:474,w:42,h:72},cars=[],distance=0,speed=240,spawn=0,offset=0,last=0,best=0;const keys={left:false,right:false};
let coins=30,bombs=0,earned=0,explosions=[];
try{const saved=JSON.parse(localStorage.getItem('racer-shop'));if(saved&&Number.isSafeInteger(saved.coins)&&saved.coins>=0&&Number.isSafeInteger(saved.bombs)&&saved.bombs>=0){coins=saved.coins;bombs=saved.bombs}}catch{}
function saveShop(){try{localStorage.setItem('racer-shop',JSON.stringify({coins,bombs}))}catch{}}
function notice(text){document.querySelector('#notice').textContent=text}
function buy(){if(coins<20){notice('코인이 부족해요. 50 m마다 10개를 모을 수 있어요!');return}coins-=20;bombs++;saveShop();stats();notice('폭탄 구매 완료! B키 또는 폭탄 버튼으로 사용하세요.')}
function bomb(){if(state!=='playing'||bombs<1)return;const targets=cars.filter(c=>c.y+c.h>0&&c.y<player.y+player.h);if(!targets.length){notice('앞에 차가 나타나면 사용하세요.');return}bombs--;explosions.push(...targets.map(c=>({x:c.x+c.w/2,y:c.y+c.h/2,life:.65})));cars=cars.filter(c=>!targets.includes(c));saveShop();stats();notice(`${targets.length}대 파괴!`)}
try{best=Number(localStorage.getItem('racer-best'))||0}catch{}
function stats(){document.querySelector('#wallet').textContent=`🪙 ${coins} 코인 · 💣 폭탄 ${bombs}개`;document.querySelector('#buy').disabled=coins<20;document.querySelector('#bomb').disabled=state!=='playing'||bombs<1;document.querySelector('#bomb').textContent=`💥 폭탄 ${bombs}`;document.querySelector('#score').textContent=`거리 ${Math.floor(distance)} m`;document.querySelector('#best').textContent=`최고 ${best} m`}
function start(){state='playing';earned=0;explosions=[];player.x=189;cars=[];distance=0;speed=240;spawn=.8;last=0;keys.left=keys.right=false;stats()}
function crash(){state='dead';best=Math.max(best,Math.floor(distance));try{localStorage.setItem('racer-best',best)}catch{}stats()}
function update(dt){explosions=explosions.map(e=>({...e,life:e.life-dt})).filter(e=>e.life>0);if(state!=='playing')return;distance+=speed*dt/12;const milestones=Math.floor(distance/50);if(milestones>earned){coins+=(milestones-earned)*10;earned=milestones;saveShop()}speed=Math.min(540,240+distance*.55);offset=(offset+speed*dt)%80;player.x=Math.max(60,Math.min(318,player.x+((keys.right?1:0)-(keys.left?1:0))*310*dt));spawn-=dt;if(spawn<=0){cars.push({x:[84,189,294][Math.floor(Math.random()*3)],y:-90,w:42,h:72,color:['#f47880','#aa95ec','#ffc55e'][Math.floor(Math.random()*3)]});spawn=Math.max(.65,1.25-distance/700)+Math.random()*.35}for(const c of cars){c.y+=speed*dt;if(player.x+player.w-5>c.x+5&&player.x+5<c.x+c.w-5&&player.y+player.h-5>c.y+5&&player.y+5<c.y+c.h-5){crash();break}}cars=cars.filter(c=>c.y<700);stats()}
function car(c,color){ctx.fillStyle='#111724';ctx.fillRect(c.x-4,c.y+12,8,16);ctx.fillRect(c.x+c.w-4,c.y+12,8,16);ctx.fillRect(c.x-4,c.y+48,8,16);ctx.fillRect(c.x+c.w-4,c.y+48,8,16);ctx.fillStyle=color;ctx.fillRect(c.x,c.y,c.w,c.h);ctx.fillStyle='#c8edf6';ctx.fillRect(c.x+7,c.y+14,c.w-14,14);ctx.fillStyle='#1c354c';ctx.fillRect(c.x+7,c.y+48,c.w-14,10);ctx.fillStyle='#fff2bb';ctx.fillRect(c.x+4,c.y+3,8,5);ctx.fillRect(c.x+c.w-12,c.y+3,8,5);ctx.fillStyle='#cf475d';ctx.fillRect(c.x+4,c.y+c.h-6,8,4);ctx.fillRect(c.x+c.w-12,c.y+c.h-6,8,4)}
function draw(){ctx.fillStyle='#245c47';ctx.fillRect(0,0,420,600);ctx.fillStyle='#343c4b';ctx.fillRect(54,0,312,600);for(let y=offset-80;y<600;y+=80){ctx.fillStyle='#e8e8d9';ctx.fillRect(153,y,4,40);ctx.fillRect(263,y,4,40);ctx.fillStyle='#f5eee0';ctx.fillRect(44,y,10,40);ctx.fillRect(366,y,10,40);ctx.fillStyle='#df6b6b';ctx.fillRect(44,y+40,10,40);ctx.fillRect(366,y+40,10,40);ctx.fillStyle='#38775a';ctx.fillRect(14,y+10,16,24);ctx.fillRect(390,y+40,16,24)}for(const c of cars)car(c,c.color);car(player,'#62d5ea');for(const e of explosions){ctx.fillStyle=e.life>.3?'#ffcc64':'#ff8048';const r=45*(1-e.life/.8);ctx.beginPath();ctx.arc(e.x,e.y,r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff4cb';ctx.fillRect(e.x-7,e.y-7,14,14);}if(state!=='playing'){ctx.fillStyle='#111827dc';ctx.fillRect(64,208,292,150);ctx.textAlign='center';ctx.fillStyle='#ffcc64';ctx.font='bold 27px monospace';ctx.fillText(state==='dead'?'CRASH!':'READY?',210,253);ctx.fillStyle='#fff';ctx.font='16px monospace';ctx.fillText(state==='dead'?`${Math.floor(distance)} m 달렸어요`:'다른 차를 피해 달려보세요',210,288);ctx.fillStyle='#b2c5db';ctx.font='13px monospace';ctx.fillText('시작 버튼 또는 스페이스바',210,321)}}
function frame(t){const dt=last?Math.min((t-last)/1000,.04):0;last=t;update(dt);draw();requestAnimationFrame(frame)}
document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Space','KeyA','KeyD','KeyB'].includes(e.code)){e.preventDefault();if(e.code==='KeyB'){if(!e.repeat)bomb()}else if(e.code==='Space'){if(!e.repeat&&state!=='playing')start()}else keys[['ArrowLeft','KeyA'].includes(e.code)?'left':'right']=true}});document.addEventListener('keyup',e=>{if(['ArrowLeft','KeyA'].includes(e.code))keys.left=false;if(['ArrowRight','KeyD'].includes(e.code))keys.right=false});for(const direction of ['left','right']){const b=document.querySelector('#'+direction);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[direction]=true});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>keys[direction]=false)}window.addEventListener('blur',()=>{keys.left=keys.right=false;last=0});document.addEventListener('visibilitychange',()=>{last=0;keys.left=keys.right=false});document.querySelector('#start').addEventListener('click',start);document.querySelector('#buy').addEventListener('click',buy);document.querySelector('#bomb').addEventListener('click',bomb);stats();requestAnimationFrame(frame);
</script></body></html>
