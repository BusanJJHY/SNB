<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff7ec"><title>은별이의 반짝 덧셈 옷장</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff7ec;color:#583c56;font-family:system-ui,-apple-system,sans-serif;min-height:100svh;padding:18px 12px}main{max-width:560px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:clamp(20px,5vw,27px);margin:0;letter-spacing:-1px}.subtitle{font-size:13px;color:#886e83;margin:5px 0}.wallet{background:#fff;border:2px solid #f3d99b;padding:9px 12px;border-radius:22px;font-weight:800;white-space:nowrap}.hero{display:flex;align-items:center;justify-content:center;gap:16px;margin:8px 0}.hero svg{width:130px;height:155px;filter:drop-shadow(0 5px 3px #c595bd22)}.bubble{max-width:220px;background:#fff;padding:14px;border-radius:18px;font-size:15px;line-height:1.5}.bubble strong{display:block;color:#b15b88}.tabs{display:flex;gap:8px;margin:10px 0}button{font:inherit;font-weight:800;cursor:pointer;border:0;min-height:48px;border-radius:16px;padding:10px 14px;touch-action:manipulation}button:focus-visible,select:focus-visible{outline:3px solid #9b70c6;outline-offset:3px}.tabs button{flex:1;background:#f0e4ef;color:#735772}.tabs button[aria-selected=true]{background:#855aa8;color:#fff}.panel{border:2px solid #ead6e7;background:#fff;border-radius:24px;padding:18px}.level{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:#886e83}select{font:inherit;color:#583c56;border:1px solid #ead6e7;background:#fff7fc;border-radius:10px;padding:8px;max-width:65%}.question{font-size:clamp(36px,10vw,54px);font-weight:900;text-align:center;letter-spacing:2px;margin:12px 0;color:#795497}.counters{display:grid;grid-template-columns:1fr 22px 1fr;align-items:center;gap:6px}.group{background:#fff4de;min-height:66px;border-radius:14px;padding:9px;text-align:center}.group:last-child{background:#f5eafa}.objects{display:flex;flex-wrap:wrap;justify-content:center;gap:5px}.objects span{font-size:24px;line-height:1.3}.empty{font-size:17px!important;color:#92768a}.count{font-size:12px;color:#886e83;margin-top:3px}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.answers button{font-size:30px;min-height:64px;background:#f1e7fa;color:#795497;border:2px solid #e1ccee}.answers button:hover{background:#e5d2f8}.answers button.correct{background:#e2f4d8;border-color:#84b476;color:#49783e}.answers button.retry{background:#fff2db;border-color:#e6be72}button:disabled{cursor:default;opacity:.7}.feedback{text-align:center;min-height:45px;line-height:1.5;margin:12px 0 0;font-weight:700;font-size:15px}.next{display:block;background:#8c64ab;color:#fff;width:100%;margin-top:8px}#read{display:block;margin:8px auto 0;background:#fff5df;color:#86683e;font-size:13px;min-height:40px}.shophead h2{font-size:21px;margin:0 0 5px}.shophead p{color:#886e83;font-size:13px;margin:0 0 14px}.items{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.item{border:2px solid #ead6e7;border-radius:18px;background:#fff9fe;text-align:center;padding:10px}.item.selected{border-color:#9d75bd;background:#f5ebff}.item svg{width:100px;height:120px;display:block;margin:auto}.item h3{font-size:15px;margin:5px 0}.item button{width:100%;font-size:14px;color:#fff;background:#9670b1;padding:8px;min-height:44px}.item button:disabled{background:#dfd0e2;color:#725f79}.shopstatus{font-size:14px;min-height:40px;text-align:center;line-height:1.5;margin-top:10px}.footer{font-size:12px;line-height:1.6;text-align:center;color:#957b8f;margin:15px 0}.footer a{color:#8c64ab}.sparkle{animation:pop .4s ease-out}@keyframes pop{50%{transform:scale(1.05)}}[hidden]{display:none!important}@media(max-width:380px){body{padding:10px 8px}.panel{padding:12px}.hero{gap:8px}.hero svg{width:105px;height:126px}.bubble{font-size:13px;padding:10px}.wallet{font-size:13px;padding:8px}.objects span{font-size:21px}}@media(prefers-reduced-motion:reduce){.sparkle{animation:none}}
</style></head>
<body><main>
<header><div><h1>은별이의 반짝 덧셈 옷장 ✨</h1><p class="subtitle">하나씩 세고, 예쁜 옷도 입어요!</p></div><div class="wallet" id="wallet" aria-live="polite">⭐ 0</div></header>
<div class="hero"><div id="avatar" aria-label="주인공이 입고 있는 옷"></div><div class="bubble"><strong>안녕, 은별아! 🌷</strong><span id="hello">별을 세어 볼까?<br>맞히면 별 코인 10개를 받아!</span></div></div>
<div class="tabs" role="tablist" aria-label="게임과 상점"><button id="learnTab" role="tab" aria-selected="true" aria-controls="learn">🌟 덧셈 놀이</button><button id="shopTab" role="tab" aria-selected="false" aria-controls="shop">🎀 옷 상점</button></div>
<section id="learn" class="panel" role="tabpanel" aria-labelledby="learnTab"><div class="level"><label for="level">놀이 고르기</label><select id="level"><option value="easy">🌱 처음에는 · 합 9까지</option><option value="challenge">🌈 도전해요 · 합 18까지</option></select></div><div id="question" class="question"></div><div class="counters" aria-label="별 그림을 하나씩 세어보세요"><div class="group" id="groupA"></div><strong>+</strong><div class="group" id="groupB"></div></div><div id="answers" class="answers" aria-label="정답 고르기"></div><button id="read">🔊 문제 읽어주기</button><div id="feedback" class="feedback" role="status">별을 모두 세어 보고 답을 눌러 줘!</div><button id="next" class="next" hidden>다음 문제도 해 볼까? →</button></section>
<section id="shop" class="panel" role="tabpanel" aria-labelledby="shopTab" hidden><div class="shophead"><h2>🎀 나만의 예쁜 옷장</h2><p>문제를 맞혀 모은 별 코인으로 옷을 사요.<br>산 옷은 언제든 다시 입을 수 있어요!</p></div><div id="items" class="items"></div><div id="shopstatus" class="shopstatus" role="status"></div></section>
<p class="footer">실제 돈을 쓰지 않는 놀이 코인이에요.<br>코인과 옷은 이 브라우저에 저장돼요.<br><a href="../">점프게임</a> · <a href="../racing/">레이싱게임</a> · <a href="../rhythm/">리듬게임</a> · <a href="../multiply/">곱셈 정원</a> · <a href="../princess/">공주 별나라</a> · <a href="../music/">음악학교</a></p>
</main>
<script>
const $=s=>document.querySelector(s),KEY='eunbyeol-addition-v1';
const outfits=[{id:'peach',name:'복숭아 원피스',price:0,color:'#f3a68f',trim:'#fff2dd',accessory:'bow'},{id:'flower',name:'분홍 꽃 드레스',price:20,color:'#ee8fbd',trim:'#fff0ac',accessory:'flower'},{id:'sky',name:'하늘빛 공주 드레스',price:30,color:'#88cbe1',trim:'#eefaff',accessory:'crown'},{id:'violet',name:'보라 요정 드레스',price:40,color:'#b496de',trim:'#ffeea6',accessory:'wings'},{id:'rainbow',name:'무지개 파티 드레스',price:60,color:'#f7b989',trim:'#fff1b7',accessory:'rainbow'}];
let data={coins:0,owned:['peach'],wearing:'peach',level:'easy'},a=0,b=0,solved=false,previous='';
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Number.isSafeInteger(s.coins)&&s.coins>=0&&Array.isArray(s.owned)){const owned=outfits.filter(o=>o.id==='peach'||s.owned.includes(o.id)).map(o=>o.id);data={coins:s.coins,owned,wearing:owned.includes(s.wearing)?s.wearing:'peach',level:s.level==='challenge'?'challenge':'easy'}}}catch{}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{}}
function avatar(o){let accessory='';if(o.accessory==='wings')accessory='<path d="M57 95 Q3 47 20 118 Q39 148 69 116 M103 95 Q157 47 140 118 Q121 148 91 116" fill="#ddc5ef" stroke="#bd9ada" stroke-width="2"/>';let dress=`<path d="M61 87 Q80 96 99 87 L103 111 L126 161 Q80 178 34 161 L57 111 Z" fill="${o.color}" stroke="#704a6533" stroke-width="2"/>`;if(o.accessory==='rainbow')dress+='<path d="M49 128 L111 128 L116 139 L44 139 Z" fill="#e99bbb"/><path d="M44 140 L116 140 L121 151 L39 151 Z" fill="#a9cfe6"/><path d="M39 152 L121 152 L125 161 Q80 177 35 161 Z" fill="#c2dba2"/>';let details='';if(o.accessory==='flower')for(const [x,y] of [[64,126],[92,143],[54,152]])details+=`<text x="${x}" y="${y}" font-size="16" fill="${o.trim}" text-anchor="middle">✿</text>`;else details='<path d="M65 133 L80 146 L95 133" fill="none" stroke="'+o.trim+'" stroke-width="4"/>';let hat=o.accessory==='crown'?'<path d="M57 29 L55 11 L69 20 L80 6 L91 20 L105 11 L103 29 Z" fill="#f4cf6f"/>':o.accessory==='flower'?'<text x="105" y="42" font-size="26" fill="#ed8abb">✿</text>':'<path d="M95 24 Q122 12 117 37 L101 31 Q84 12 84 34 Z" fill="'+o.color+'"/><circle cx="100" cy="28" r="5" fill="'+o.trim+'"/>';
return `<svg viewBox="0 0 160 190" role="img" aria-label="${o.name}"><ellipse cx="80" cy="183" rx="48" ry="5" fill="#e9d5e5"/>${accessory}<path d="M63 159 L64 177 M97 159 L96 177" stroke="#edbc9e" stroke-width="11"/><path d="M56 180 Q66 173 71 181 M89 181 Q96 173 106 180" stroke="#765779" stroke-width="8" stroke-linecap="round"/><path d="M53 55 Q41 12 80 18 Q120 15 112 62 L112 94 L46 94 Z" fill="#654536"/><path d="M60 94 L45 119 M100 94 L115 119" stroke="#edbc9e" stroke-width="10" stroke-linecap="round"/>${dress}<path d="M58 110 Q80 121 102 110" fill="none" stroke="${o.trim}" stroke-width="6"/>${details}<rect x="72" y="74" width="16" height="17" rx="6" fill="#edbc9e"/><ellipse cx="80" cy="55" rx="31" ry="32" fill="#f6cdb0"/><path d="M49 47 Q48 17 79 20 Q110 18 112 47 Q85 39 77 28 Q66 44 49 47" fill="#654536"/><circle cx="68" cy="56" r="3" fill="#583c45"/><circle cx="93" cy="56" r="3" fill="#583c45"/><ellipse cx="61" cy="66" rx="6" ry="3" fill="#ed9fa2"/><ellipse cx="100" cy="66" rx="6" ry="3" fill="#ed9fa2"/><path d="M74 68 Q81 75 88 68" fill="none" stroke="#a75d68" stroke-width="2.5" stroke-linecap="round"/>${hat}</svg>`}
function render(){const worn=outfits.find(o=>o.id===data.wearing);$('#wallet').textContent=`⭐ ${data.coins}`;$('#avatar').innerHTML=avatar(worn);$('#avatar').setAttribute('aria-label',`주인공: ${worn.name} 입는 중`);$('#items').innerHTML=outfits.map(o=>{const owned=data.owned.includes(o.id),selected=data.wearing===o.id;return `<article class="item ${selected?'selected':''}">${avatar(o)}<h3>${o.name}</h3><button data-outfit="${o.id}" ${selected?'disabled':''}>${selected?'✓ 입고 있어요':owned?'입어 보기':`⭐ ${o.price} · 사서 입기`}</button></article>`}).join('');for(const btn of document.querySelectorAll('[data-outfit]'))btn.addEventListener('click',()=>purchase(btn.dataset.outfit))}
function purchase(id){const o=outfits.find(o=>o.id===id);if(!o)return;if(!data.owned.includes(id)){if(data.coins<o.price){$('#shopstatus').textContent=`별 코인 ${o.price-data.coins}개를 더 모아 보자! 덧셈을 맞히면 10개를 받아.`;return}data.coins-=o.price;data.owned.push(id)}data.wearing=id;save();render();$('#shopstatus').textContent=`${o.name}를 입었어! 정말 잘 어울려 🌸`;$('#hello').textContent='새 옷을 입고 또 덧셈 놀이 해 볼까?'}
function showTab(shop){$('#learn').hidden=shop;$('#shop').hidden=!shop;$('#learnTab').setAttribute('aria-selected',String(!shop));$('#shopTab').setAttribute('aria-selected',String(shop));$('#hello').textContent=shop?'별 코인으로 마음에 드는 옷을 골라 봐!':'천천히 해도 괜찮아. 별을 하나씩 세어 봐!'}
function objects(n){return `<div class="objects">${n?'<span aria-hidden="true">⭐</span>'.repeat(n):'<span class="empty">없어요</span>'}</div><div class="count">${n}개</div>`}
function newQuestion(){solved=false;let pair;do{a=Math.floor(Math.random()*(data.level==='easy'?6:10));b=Math.floor(Math.random()*(data.level==='easy'?6:10));pair=`${a},${b}`}while(a+b===0||data.level==='easy'&&a+b>9||pair===previous);previous=pair;$('#question').textContent=`${a} + ${b} = ?`;$('#groupA').innerHTML=objects(a);$('#groupB').innerHTML=objects(b);const answer=a+b,max=data.level==='easy'?9:18,choices=new Set([answer]);const candidates=Array.from({length:max+1},(_,i)=>i).filter(i=>i!==answer&&Math.abs(i-answer)<=3);while(choices.size<3){const i=Math.floor(Math.random()*candidates.length);choices.add(candidates.splice(i,1)[0])}$('#answers').innerHTML=[...choices].sort((x,y)=>x-y).map(n=>`<button data-answer="${n}" aria-label="답 ${n}">${n}</button>`).join('');for(const btn of document.querySelectorAll('[data-answer]'))btn.addEventListener('click',()=>answerQuestion(Number(btn.dataset.answer),btn));$('#feedback').textContent='별을 모두 세어 보고 답을 눌러 줘!';$('#next').hidden=true}
function answerQuestion(value,btn){if(solved)return;if(value!==a+b){btn.classList.add('retry');$('#feedback').textContent='괜찮아! 양쪽 별을 모두 세어 보고 다시 골라 봐 🌷';return}solved=true;data.coins+=10;save();render();for(const choice of document.querySelectorAll('[data-answer]')){choice.disabled=true;if(Number(choice.dataset.answer)===a+b)choice.classList.add('correct')}$('#feedback').textContent=`딩동댕! ${a} 더하기 ${b}는 ${a+b}! 별 코인 10개 받았어 ⭐`;$('#next').hidden=false;$('#avatar').classList.remove('sparkle');void $('#avatar').offsetWidth;$('#avatar').classList.add('sparkle')}
$('#learnTab').addEventListener('click',()=>showTab(false));$('#shopTab').addEventListener('click',()=>showTab(true));$('#next').addEventListener('click',newQuestion);$('#level').value=data.level;$('#level').addEventListener('change',()=>{data.level=$('#level').value;save();newQuestion()});$('#read').addEventListener('click',()=>{if('speechSynthesis'in window){speechSynthesis.cancel();const words=new SpeechSynthesisUtterance(`${a} 더하기 ${b}는 얼마일까요?`);words.lang='ko-KR';words.rate=.8;speechSynthesis.speak(words)}else $('#feedback').textContent='양쪽 별을 하나씩 세어 봐!'});render();newQuestion();
</script></body></html>
